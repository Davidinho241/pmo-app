<div id="app"></div>
<script>
/* ===== Utilitaires ===== */
const ACT={};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='x')=>p+Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-3);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const DAY=864e5;
const d2n=s=>{if(!s||typeof s!=='string')return NaN;const a=s.split('-').map(Number);return Math.round(Date.UTC(a[0],a[1]-1,a[2])/DAY)};
const n2d=n=>{const t=new Date(n*DAY);return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0')};
const today=()=>{const t=new Date();return Math.round(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/DAY)};
const fdate=s=>{const n=typeof s==='number'?s:d2n(s);if(isNaN(n))return '';return new Date(n*DAY).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'})};
const fshort=n=>new Date(n*DAY).toLocaleDateString('fr-FR',{day:'numeric',month:'short',timeZone:'UTC'});
const nf=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
const nf2=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>nf.format(Math.round(v))+' %';
const CURS={XAF:'FCFA',EUR:'€',USD:'$'};
const money=n=>nf.format(Math.round(n||0))+' '+(CURS[S.settings.cur]||'FCFA');
const moneyC=n=>{n=n||0;const a=Math.abs(n),u=CURS[S.settings.cur]||'FCFA';if(a>=1e9)return nf1.format(n/1e9)+' Md '+u;if(a>=1e6)return nf1.format(n/1e6)+' M '+u;if(a>=1e3)return nf.format(n/1e3)+' k '+u;return nf.format(n)+' '+u};
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ===== Référentiels ===== */
const STATUSES=['Idée','Planifié','En cours','En pause','Terminé','Annulé'];
const PRIORITIES=['Haute','Moyenne','Basse'];
const RISK_CATS=['Technique','Planning','Budget','Réglementaire','Partenaire','Sécurité','Ressources','Qualité'];
const RISK_RESP=['Éviter','Réduire','Transférer','Accepter'];
const RISK_STATUS=['Ouvert','En traitement','Clos','Matérialisé'];
const RAGL={ok:'Maîtrisé',warn:'À surveiller',bad:'Critique',idle:'N/A'};
const RANK={idle:0,ok:1,warn:2,bad:3};
const worst=(...a)=>a.reduce((m,x)=>RANK[x]>RANK[m]?x:m,'idle');
const DEF_SETTINGS={org:'',cur:'XAF',spiWarn:.95,spiBad:.85,ovWarn:.02,ovBad:.10,qWarn:85,qBad:70,
  types:['Intégration API','Remittance','Performance','Conformité','Produit','Infrastructure'],
  cats:['Développement','Licences & outils','Infrastructure','Prestataires','Formation','Conformité & audit','Frais de projet','Imprévus'],startedClean:false};

/* ===== État ===== */
const S={settings:{...DEF_SETTINGS},projects:{},demo:false,mode:'local',loaded:false};

/* ===== Calculs : avancement, délai ===== */
function progressOf(p,t0=today()){
  if(p.status==='Terminé')return{planned:100,actual:100,weighted:true};
  const ts=(p.tasks||[]).filter(t=>!t.ms&&!isNaN(d2n(t.start))&&!isNaN(d2n(t.end)));
  const frac=(s,e)=>{const tot=workDays(s,e);if(tot>0)return{w:tot,f:clamp(workDays(s,Math.min(t0,e))/tot,0,1)};return{w:Math.max(1,e-s+1),f:clamp((t0-s+1)/(e-s+1),0,1)}};
  if(!ts.length){const s=d2n(p.start),e=d2n(p.end);const pl=(isNaN(s)||isNaN(e))?0:frac(s,e).f;return{planned:pl*100,actual:clamp(+p.progress||0,0,100),weighted:false}}
  let W=0,P=0,A=0;
  ts.forEach(t=>{const s=d2n(t.start),e=d2n(t.end),q=frac(s,e);W+=q.w;P+=q.w*q.f;A+=q.w*clamp(+t.progress||0,0,100)/100});
  return{planned:P/W*100,actual:A/W*100,weighted:true};
}
const isLate=(t,t0=today())=>!isNaN(d2n(t.end))&&d2n(t.end)<t0&&(+t.progress||0)<100;

/* ===== Calculs : budget ===== */
const lineEtc=l=>(l.etc===null||l.etc===undefined||l.etc==='')?Math.max(0,(+l.planned||0)-(+l.actual||0)):(+l.etc||0);
function budgetOf(p){
  const L=p.lines||[];const planned=sum(L,l=>l.planned),committed=sum(L,l=>l.committed),actual=sum(L,l=>l.actual);
  const eac=sum(L,l=>(+l.actual||0)+lineEtc(l));const B=+p.budget||planned;
  return{B,planned,committed,actual,eac,etc:eac-actual,var:B-eac,overrun:B>0?(eac-B)/B:0,conso:B>0?actual/B*100:0,has:L.length>0||B>0};
}
/* ===== Calculs : risques ===== */
const rScore=r=>(+r.prob||0)*(+r.imp||0);
const rLevel=s=>s>=15?{k:'Critique',c:'bad'}:s>=10?{k:'Élevé',c:'warn'}:s>=5?{k:'Moyen',c:'acc'}:{k:'Faible',c:'ok'};
const rOpen=r=>r.status!=='Clos';

/* ===== Calculs : qualité ===== */
function qualityOf(p){
  const q=p.quality||{};const parts=[];const num=v=>v!==null&&v!==undefined&&v!==''&&!isNaN(+v);
  if(num(q.delP)&&+q.delP>0&&num(q.delA))parts.push([.35,clamp(q.delA/q.delP*100,0,100)]);
  if(num(q.tstP)&&+q.tstP>0&&num(q.tstOk))parts.push([.30,clamp(q.tstOk/q.tstP*100,0,100)]);
  if(num(q.defC)||num(q.defM)||num(q.defm))parts.push([.20,clamp(100-(+q.defC||0)*15-(+q.defM||0)*5-(+q.defm||0),0,100)]);
  if(num(q.sat)&&+q.sat>0)parts.push([.15,clamp((q.sat-1)/4*100,0,100)]);
  if(!parts.length)return{score:null,rag:'idle'};
  const W=sum(parts,x=>x[0]);const score=sum(parts,x=>x[0]*x[1])/W;
  let rag=score>=S.settings.qWarn?'ok':score>=S.settings.qBad?'warn':'bad';
  if((+q.defC||0)>=2)rag='bad';else if((+q.defC||0)===1&&rag==='ok')rag='warn';
  return{score,rag};
}
/* ===== KPI projet ===== */
function kpi(p,t0=today()){
  const st=S.settings,pr=progressOf(p,t0),bd=budgetOf(p),q=qualityOf(p);
  const s=d2n(p.start),e=d2n(p.end);
  const spi=pr.planned>0.5?pr.actual/pr.planned:1;
  const ts=(p.tasks||[]).filter(t=>!t.ms);const late=ts.filter(t=>isLate(t,t0));
  let fe=e,delay=0;
  if(p.status!=='Terminé'&&!isNaN(e)&&!isNaN(s)){
    if(t0>e&&pr.actual<100){fe=t0+Math.ceil((100-pr.actual)/100*(e-s+1));}
    else if(spi<1&&spi>0.05&&t0>s){fe=Math.min(e+400,Math.round(s+(e-s+1)/spi-1));}
    delay=Math.max(0,fe-e);
  }
  const EV=bd.B*pr.actual/100;const cpi=bd.actual>0?clamp(EV/bd.actual,0,3):1;
  let sr;
  if(['Idée','Annulé'].includes(p.status))sr='idle';
  else if(p.status==='Terminé')sr='ok';
  else if(p.status==='En pause')sr='warn';
  else if(p.status==='Planifié')sr=(t0>s)?'warn':'ok';
  else{sr=spi>=st.spiWarn?'ok':spi>=st.spiBad?'warn':'bad';if(t0>e)sr='bad';else if(sr==='ok'&&late.length>=3)sr='warn';}
  let br='idle';
  if(bd.has&&bd.B>0){br=bd.overrun<=st.ovWarn?'ok':bd.overrun<=st.ovBad?'warn':'bad';if(br==='ok'&&bd.actual>0&&cpi<.9&&pr.actual>10)br='warn';}
  const R=(p.risks||[]).filter(rOpen);const crit=R.filter(r=>rScore(r)>=15).length,high=R.filter(r=>rScore(r)>=10&&rScore(r)<15).length;
  const rr=crit?'bad':high?'warn':R.length?'ok':'idle';
  let overall=worst(sr,br,q.rag);if(crit&&overall==='ok')overall='warn';if(overall==='idle'&&rr!=='idle')overall=rr==='bad'?'warn':'ok';
  if(['Idée','Annulé'].includes(p.status))overall='idle';
  const manual=p.ragManual&&p.ragManual!=='auto';if(manual)overall=p.ragManual;
  const nm=(p.tasks||[]).filter(t=>t.ms&&!isNaN(d2n(t.end))&&d2n(t.end)>=t0&&(+t.progress||0)<100).sort((a,b)=>d2n(a.end)-d2n(b.end))[0];
  return{pr,planned:pr.planned,actual:pr.actual,spi,late:late.length,fe,delay,bd,B:bd.B,AC:bd.actual,EAC:bd.eac,EV,cpi,overrun:bd.overrun,q,qs:q.score,
    risks:{open:R.length,crit,high,max:Math.max(0,...R.map(rScore))},rag:{schedule:sr,budget:br,quality:q.rag,risk:rr,overall,manual},
    nextMs:nm,daysLeft:isNaN(e)?null:e-t0,total:(p.tasks||[]).length,done:ts.filter(t=>(+t.progress||0)>=100).length};
}
const snapOf=(p)=>{const k=kpi(p);return{planned:Math.round(k.planned*10)/10,actual:Math.round(k.actual*10)/10,spi:Math.round(k.spi*100)/100,cpi:Math.round(k.cpi*100)/100,ac:Math.round(k.AC),eac:Math.round(k.EAC),B:Math.round(k.B),risks:k.risks.open,crit:k.risks.crit,q:k.qs==null?null:Math.round(k.qs),rag:k.rag.overall}};

/* ===== KPI portefeuille ===== */
function portfolio(list=listProjects()){
  const ks=list.map(p=>({p,k:kpi(p)}));const act=ks.filter(x=>!['Terminé','Idée'].includes(x.p.status));
  const rag={ok:0,warn:0,bad:0,idle:0};ks.filter(x=>x.p.status!=='Terminé').forEach(x=>rag[x.k.rag.overall]++);
  const B=sum(ks,x=>x.k.B),AC=sum(ks,x=>x.k.AC),EAC=sum(ks,x=>x.k.EAC),EV=sum(ks,x=>x.k.EV);
  const wB=sum(act,x=>x.k.B)||act.length||1;const wp=x=>(sum([x],y=>y.k.B)||1);
  const planned=act.length?sum(act,x=>x.k.planned*wp(x))/sum(act,x=>wp(x)):0,actual=act.length?sum(act,x=>x.k.actual*wp(x))/sum(act,x=>wp(x)):0;
  const qs=ks.filter(x=>x.k.qs!=null);
  return{ks,act,rag,B,AC,EAC,EV,planned,actual,spi:planned>0.5?actual/planned:1,cpi:AC>0?clamp(EV/AC,0,3):1,overrun:B>0?(EAC-B)/B:0,
    late:ks.filter(x=>x.k.rag.schedule==='bad').length,lateW:ks.filter(x=>x.k.rag.schedule==='warn').length,delayTot:sum(ks,x=>x.k.delay),
    risksOpen:sum(ks,x=>x.k.risks.open),crit:sum(ks,x=>x.k.risks.crit),q:qs.length?sum(qs,x=>x.k.qs)/qs.length:null,qBad:ks.filter(x=>x.k.rag.quality==='bad').length,
    defects:sum(ks,x=>(+x.p.quality?.defC||0)+(+x.p.quality?.defM||0))};
}

/* ===== Planning : recalcul selon dépendances (fin→début) ===== */
function reschedule(p){
  const byId=Object.fromEntries((p.tasks||[]).map(t=>[t.id,t]));let moved=0;
  for(let pass=0;pass<60;pass++){let ch=false;
    (p.tasks||[]).forEach(t=>{const ds=(t.deps||[]).map(i=>byId[i]).filter(Boolean);if(!ds.length)return;
      const mx=Math.max(...ds.map(d=>d2n(d.end)));const need=nextWork(mx+(t.ms?0:1));const s=d2n(t.start),e=d2n(t.end);
      if(!isNaN(need)&&!isNaN(s)&&s<need){if(t.ms){t.start=n2d(need);t.end=t.start}else{const dur=Math.max(1,workDays(s,e)||(e-s+1));t.start=n2d(need);t.end=n2d(addWork(need,dur))}ch=true;moved++}});
    if(!ch)break;}
  return moved;
}
const phases=p=>{const o=[];(p.tasks||[]).forEach(t=>{const k=t.phase||'Sans phase';if(!o.includes(k))o.push(k)});return o};

/* ===== Persistance : base partagée (db) ou navigateur ===== */
const Store={db:null,dirty:new Set(),dels:new Set(),timer:null,busy:false,json:{},setDirty:false};
const thaw=o=>JSON.parse(JSON.stringify(o));
function loadLocal(){try{const r=localStorage.getItem('pmo.v1');if(r){const d=JSON.parse(r);S.settings={...DEF_SETTINGS,...(d.settings||{})};S.projects=d.projects||{};return true}}catch(e){}return false}
function saveLocal(){try{localStorage.setItem('pmo.v1',JSON.stringify({settings:S.settings,projects:S.demo?{}:S.projects}))}catch(e){}}
function setSave(t){const el=$('#savestate');if(el)el.textContent=t}
function settleDemo(){if(!S.demo&&Object.keys(S.projects).length===0&&!S.settings.startedClean){S.projects=makeDemo();S.demo=true}}
async function initStore(){
  let hasApi=false;
  try{const r=await fetch('api/health',{cache:'no-store'});if(r.ok){const j=await r.json();hasApi=!!(j&&j.app==='pmo')}}catch(e){}
  if(hasApi)return initApi();
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){S.mode='local';loadLocal();settleDemo();S.loaded=true;render();return}
  Store.db=db;S.mode='cloud';
  let g1=false,g2=false;const ready=()=>{if(g1&&g2&&!S.loaded){S.loaded=true;render()}};
  db.doc('meta/settings').onSnapshot(s=>{
    if(s.exists){const d=thaw(s.data());const j=JSON.stringify(d);if(j!==Store.json.__s){Store.json.__s=j;S.settings={...DEF_SETTINGS,...d};if(S.settings.startedClean&&S.demo){S.projects={};S.demo=false}if(S.loaded)render()}}
    g1=true;settleDemo();ready()},()=>{g1=true;ready()});
  db.collection('projects').onSnapshot(sn=>{
    const m={};let changed=false;
    sn.docs.forEach(d=>{const id=d.id;if(Store.dirty.has(id)&&S.projects[id]){m[id]=S.projects[id];return}
      const b=thaw(d.data());const j=JSON.stringify(b);if(Store.json[id]!==j){Store.json[id]=j;changed=true}m[id]=b});
    Object.keys(S.projects).forEach(id=>{if(!m[id]&&Store.dirty.has(id))m[id]=S.projects[id]});
    if(sn.size===0&&S.demo&&!S.settings.startedClean){g2=true;ready();return}
    if(Object.keys(S.projects).length!==Object.keys(m).length)changed=true;
    S.projects=m;S.demo=false;g2=true;settleDemo();if(S.loaded&&changed)render();ready()},()=>{g2=true;ready()});
  setTimeout(()=>{if(!S.loaded){g1=g2=true;settleDemo();ready()}},6000);
}
function touch(p){if(S.demo){setSave('Mode démo : non enregistré');return}Store.dirty.add(p.id);queueFlush()}
function touchSettings(){Store.setDirty=true;queueFlush()}
function dropProject(id){delete S.projects[id];if(S.demo)return;Store.dirty.delete(id);Store.dels.add(id);queueFlush()}
function queueFlush(){setSave('Enregistrement…');clearTimeout(Store.timer);Store.timer=setTimeout(flush,450)}
async function flush(){
  if(S.mode==='api')return flushApi();
  if(S.mode==='local'){saveLocal();Store.dirty.clear();Store.dels.clear();Store.setDirty=false;setSave('Enregistré dans ce navigateur');return}
  if(Store.busy){queueFlush();return}
  Store.busy=true;
  try{
    for(const id of [...Store.dirty]){const p=S.projects[id];Store.dirty.delete(id);if(!p)continue;
      const body=thaw(p);delete body._mem;const j=JSON.stringify(body);
      if(j.length>250000)toast('Ce projet est très volumineux ('+Math.round(j.length/1024)+' Ko) : limite de 256 Ko par projet.');
      try{await Store.db.doc('projects/'+id).set(body);Store.json[id]=j}catch(e){Store.dirty.add(id);throw e}}
    for(const id of [...Store.dels]){await Store.db.doc('projects/'+id).delete();Store.dels.delete(id);delete Store.json[id]}
    if(Store.setDirty){Store.setDirty=false;try{await Store.db.doc('meta/settings').set(thaw(S.settings))}catch(e){Store.setDirty=true;throw e}}
    setSave('Enregistré');
  }catch(e){setSave('Échec de l’enregistrement');toast(e&&e.code==='quota_exceeded'?'Espace de stockage plein : supprimez des projets ou des historiques.':'Enregistrement impossible. Vos droits sont peut-être en lecture seule.')}
  Store.busy=false;
}

function keepDemo(){S.demo=false;S.settings.startedClean=true;Object.values(S.projects).forEach(p=>{delete p._mem;touch(p)});touchSettings();render();toast('Portefeuille de démonstration enregistré.')}

      const rest=status==='Terminé'?0:Math.max(0,pl*(1-k.actual/100)*(cat==='Imprévus'?.5:cf));

    for(let r=0;r<rn;r++){let ix;do{ix=Math.floor(rnd()*RT.length)}while(used.has(ix));used.add(ix);const rt=RT[ix];

    if(!['Planifié','Idée'].includes(status)){
      const kk=kpi(p);const weeks=Math.min(5,Math.floor((t0-start)/7));
      for(let w=weeks;w>=1;w--){const dn=t0-w*7;const pl=progressOf(p,dn).planned;const ac=kk.planned>0.5?kk.actual*Math.min(1,pl/Math.max(1,kk.planned)):0;const j=1+between(-.03,.03);
        const a=Math.round(Math.min(ac*j,kk.actual)*10)/10;
        p.updates.push({id:uid('u'),date:n2d(dn),rag:hl==='good'?'ok':hl==='mid'?(w>2?'ok':'warn'):(w>3?'warn':'bad'),
          done:pick(DN),next:pick(NX),issues:pick(IS),decisions:'',snap:{planned:Math.round(pl*10)/10,actual:a,spi:pl>0.5?Math.round(a/pl*100)/100:1,cpi:Math.round(kk.cpi*100)/100,ac:Math.round(kk.AC*(kk.actual>0?a/kk.actual:0)),eac:Math.round(kk.EAC*between(.985,1.015)),B:Math.round(kk.B),risks:kk.risks.open,crit:kk.risks.crit,q:kk.qs==null?null:Math.round(kk.qs),rag:hl==='good'?'ok':hl==='mid'?'warn':'bad'}})}}
    out[p.id]=p});
  return out;
}

  let r;
  try{r=await fetch(url,{method,credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','X-Requested-With':'pmo'},body:body===undefined?undefined:JSON.stringify(body)})}
  catch(e){const err=new Error('Serveur injoignable');err.status=0;throw err}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const err=new Error((j&&j.error)||('Erreur '+r.status));err.status=r.status;err.body=j||{};throw err}
  return j;
}

async function pollOnce(){
  if(S.mode!=='api'||!S.loaded||Store.busy||Store.dirty.size||Store.dels.size||Store.setDirty||document.hidden||$('.mask'))return;
  try{
    const r=await api('GET','api/rev');if(r.rev===Store.rev)return;
    const j=await api('GET','api/state');Store.rev=j.rev;
    if(S.demo&&!j.projects.length&&!(j.settings&&j.settings.startedClean))return;
    const before=sigOf(S.projects,S.settings),wasDemo=S.demo;
    const prev=S.projects,prevS=S.settings;applyState(j);
    if(sigOf(S.projects,S.settings)!==before||wasDemo!==S.demo){if(V.pid&&!S.projects[V.pid]){V.view='port';V.pid=null}render();toast('Données mises à jour par un autre utilisateur.')}
  }catch(e){if(e.status===401){S.loaded=false;renderLogin('Session expirée. Reconnectez-vous.')}}
}
async function flushApi(){
  if(Store.busy){queueFlush();return}
  Store.busy=true;
  try{
    for(const id of [...Store.dirty]){
      const p=S.projects[id];Store.dirty.delete(id);if(!p)continue;
      const body=thaw(p);delete body._mem;delete body._v;
      try{const r=await api('PUT','api/projects/'+encodeURIComponent(id),{project:body,version:p._v==null?null:p._v});p._v=r.version}
      catch(e){
        if(e.status===409){const cur=e.body&&e.body.current;if(cur)S.projects[id]=cur;else delete S.projects[id];toast('Ce projet a été modifié par un autre utilisateur : la version à jour est affichée. Vos dernières modifications n’ont pas été enregistrées.');render();continue}
        Store.dirty.add(id);throw e}}
    for(const id of [...Store.dels]){await api('DELETE','api/projects/'+encodeURIComponent(id));Store.dels.delete(id)}
    if(Store.setDirty){Store.setDirty=false;try{await api('PUT','api/settings',S.settings)}catch(e){Store.setDirty=true;throw e}}
    Store.rev=null;setSave('Enregistré dans la base MySQL');
  }catch(e){
    if(e.status===401){S.loaded=false;renderLogin('Session expirée. Reconnectez-vous : vos modifications en attente seront envoyées ensuite.')}
    else if(e.status===403){Store.dirty.clear();Store.dels.clear();Store.setDirty=false;toast('Votre compte est en lecture seule : modification non enregistrée.');try{applyState(await api('GET','api/state'));render()}catch(x){}}
    else if(e.status===400||e.status===413){Store.dirty.clear();Store.setDirty=false;setSave('Échec de l’enregistrement');toast('Enregistrement refusé : '+e.message)}
    else{setSave('Hors connexion : nouvelle tentative…');setTimeout(queueFlush,5000)}
  }
  Store.busy=false;
}

  extra:{l:'Férié extraordinaire',off:1,c:'bad',h:'Jour chômé décidé en cours d’année'},

function easterN(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return utcN(y,mo,da)}
const ISL={};
function islamN(y,month,day){const key=y+':'+month+':'+day;if(key in ISL)return ISL[key];let r=null;
  try{const f=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{month:'numeric',day:'numeric',timeZone:'UTC'});
    for(let n=utcN(y,1,1);n<=utcN(y,12,31);n++){const p=f.formatToParts(new Date(n*DAY));const mm=+p.find(x=>x.type==='month').value,dd=+p.find(x=>x.type==='day').value;if(mm===month&&dd===day){r=n;break}}}catch(e){r=null}
  if(r===null){const T={'10:1':{2025:[3,30],2026:[3,20],2027:[3,10],2028:[2,27],2029:[2,15],2030:[2,5]},'12:10':{2025:[6,6],2026:[5,27],2027:[5,17],2028:[5,5],2029:[4,24],2030:[4,14]}}[month+':'+day];const t=T&&T[y];r=t?utcN(y,t[0],t[1]):utcN(y,1,1)}
  return ISL[key]=r}
/* Fériés légaux du Cameroun. civil = fête civile (loi 73/5 : si elle tombe un dimanche, le lundi suivant est chômé) ; rel = fête religieuse
   dont la date est fixée par décision officielle (date calculée, à confirmer) ; opt = jour facultatif, désactivé par défaut. */
const HOL=[
 {k:'nyd',l:'Jour de l’An',civil:1,f:y=>utcN(y,1,1)},
 {k:'youth',l:'Fête de la Jeunesse',civil:1,f:y=>utcN(y,2,11)},
 {k:'fitr',l:'Aïd el-Fitr (fin du Ramadan)',rel:1,f:y=>islamN(y,10,1)},
 {k:'gfri',l:'Vendredi Saint',f:y=>easterN(y)-2},
 {k:'labour',l:'Fête du Travail',civil:1,f:y=>utcN(y,5,1)},
 {k:'asc',l:'Ascension',f:y=>easterN(y)+39},
 {k:'nat',l:'Fête nationale',civil:1,f:y=>utcN(y,5,20)},
 {k:'adha',l:'Aïd el-Kébir (Tabaski)',rel:1,f:y=>islamN(y,12,10)},
 {k:'ass',l:'Assomption',f:y=>utcN(y,8,15)},
 {k:'xmas',l:'Noël',f:y=>utcN(y,12,25)},
 {k:'emon',l:'Lundi de Pâques',opt:1,f:y=>easterN(y)+1},
 {k:'reun',l:'Réunification (1er octobre)',opt:1,f:y=>utcN(y,10,1)}];
function holResolve(y){const cfg=calCfg();return HOL.map(h=>{const o=cfg.hol[y+':'+h.k]||{};const on=h.opt?o.on===true:o.on!==false;const base=h.f(y);const date=o.date&&!isNaN(d2n(o.date))?d2n(o.date):base;return{...h,y,date,base,on,custom:date!==base}}).sort((a,b)=>a.date-b.date)}
const CALC={ref:null,init:false,maps:{}};
function yearMap(y){
  if(!CALC.init||CALC.ref!==S.settings.cal){CALC.ref=S.settings.cal;CALC.init=true;CALC.maps={};CALC.days=new Set(calCfg().days)}
  if(CALC.maps[y])return CALC.maps[y];
  const cfg=calCfg(),m=new Map();
  holResolve(y).forEach(h=>{if(!h.on)return;m.set(h.date,{k:'hol',l:h.l});if(cfg.carry&&h.civil&&mon0(h.date)===6&&!m.has(h.date+1))m.set(h.date+1,{k:'hol',l:'Report · '+h.l,carry:1})});
  const apply=ev=>{const a=d2n(ev.from),b=d2n(ev.to||ev.from);if(isNaN(a)||isNaN(b))return;for(let n=Math.max(a,utcN(y,1,1));n<=Math.min(b,utcN(y,12,31));n++)m.set(n,{k:ev.type,l:ev.label||EV_TYPES[ev.type].l})};
  (cfg.events||[]).filter(e=>EV_TYPES[e.type]&&EV_TYPES[e.type].off).forEach(apply);
  (cfg.events||[]).filter(e=>e.type==='work').forEach(apply);

}

  if(e)return e.k==='work'?{work:true,k:'work',l:e.l}:{work:false,k:e.k,l:e.l};
  if(!CALC.days.has(mon0(n)+1))return{work:false,k:'we',l:wdName(n)};
  return{work:true,k:null,l:''}}

function prevWork(n){for(let i=0;i<800;i++){if(isWork(n))return n;n--}return n}

const hm=s=>{const m=String(s||'').match(/^(\d{1,2}):(\d{2})$/);return m?(+m[1])*60+(+m[2]):NaN};
function dayHours(){const c=calCfg();const h=(hm(c.end)-hm(c.start)-(hm(c.be)-hm(c.bs)))/60;return isNaN(h)?8:h}
const nfH=h=>nf1.format(h)+' h';
const fhm=s=>String(s).replace(':','h');
const taskDays=t=>t.ms?0:(workDays(d2n(t.start),d2n(t.end))||Math.max(1,d2n(t.end)-d2n(t.start)+1));
const isDeploy=t=>!!t.deploy||(/mise en prod|mise en production|d[ée]ploiement|d[ée]ploy|go-?live|bascule/i.test(t.name||'')&&!/pr[ée][\s-]?prod/i.test(t.name||''));
const sameName=(a,b)=>norm(a)!==''&&norm(a)===norm(b);
const overlaps=(a1,b1,a2,b2)=>a1<=b2&&a2<=b1;
function eventsOn(n,types){return (calCfg().events||[]).filter(e=>(!types||types.includes(e.type))&&overlaps(d2n(e.from),d2n(e.to||e.from),n,n))}
/* Écarts entre les plannings et le calendrier */
function calConflicts(){
  const out={deploy:[],absent:[],offdays:[]};const t0=today();const ev=calCfg().events||[];
  listProjects().filter(p=>!['Terminé','Idée'].includes(p.status)).forEach(p=>(p.tasks||[]).forEach(t=>{
    if((+t.progress||0)>=100)return;const s=d2n(t.start),e=d2n(t.end);if(isNaN(s)||isNaN(e)||e<t0)return;
    if(!isWork(s)||!isWork(e))out.offdays.push({p,t});
    if(isDeploy(t))ev.filter(x=>x.type==='freeze'&&(!x.pid||x.pid===p.id)&&overlaps(s,e,d2n(x.from),d2n(x.to||x.from))).forEach(x=>out.deploy.push({p,t,ev:x}));

  }));
  return out;
}
/* Cale une tâche sur les jours ouvrés (utilisé après saisie ou recalage) */
function snapDates(v,isMs){
  const o={start:v.start,end:v.end};
  if(isMs){const e=nextWork(d2n(v.end));v.end=n2d(e);v.start=v.end}
  else{const s=nextWork(d2n(v.start));let e=prevWork(d2n(v.end));if(isNaN(e)||e<s)e=s;v.start=n2d(s);v.end=n2d(e)}
  return o.start!==v.start||o.end!==v.end;
}

/* ----- Fenêtres modales ----- */
function closeModal(){$$('.mask').forEach(m=>m.remove())}
function openModal({title,body,foot,onMount}){
  closeModal();const m=document.createElement('div');m.className='mask';
  m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="btn ghost sm" data-act="modal-close" aria-label="Fermer">✕</button></header><div class="body">${body}</div>${foot?`<footer>${foot}</footer>`:''}</div>`;
  m.addEventListener('mousedown',e=>{if(e.target===m)closeModal()});document.body.appendChild(m);
  const f=$('input:not([type=hidden]),select,textarea',m);if(f&&!/Mobi/i.test(navigator.userAgent))f.focus();if(onMount)onMount(m);return m;
}
function fieldHTML(f,v){
  const id='f_'+f.k,val=v==null?'':v,w=f.wide?' wide':'',req=f.req?' required':'';
  let c;
  if(f.t==='textarea')c=`<textarea id="${id}" name="${f.k}"${req}>${esc(val)}</textarea>`;
  else if(f.t==='select')c=`<select id="${id}" name="${f.k}">${optsHTML(f.o,val,f.blank)}</select>`;
  else if(f.t==='multi')c=`<select id="${id}" name="${f.k}" multiple size="${Math.min(6,Math.max(3,f.o.length))}">${f.o.map(o=>`<option value="${esc(o[0])}"${(val||[]).includes(o[0])?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if(f.t==='check')return `<label class="f${w}" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="${id}" name="${f.k}"${val?' checked':''} style="width:auto"> ${esc(f.l)}</label>`;
  else c=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(val)}"${req}${f.step?` step="${f.step}"`:''}${f.min!=null?` min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''}${f.ph?` placeholder="${esc(f.ph)}"`:''}${f.list?` list="${f.list}"`:''}>`;
  return `<label class="f${w}" for="${id}">${esc(f.l)}${f.req?' *':''}${c}</label>`;
}
function readForm(form,fields){
  const o={};fields.forEach(f=>{const el=form.elements[f.k];if(!el)return;
    if(f.t==='check')o[f.k]=el.checked;
    else if(f.t==='multi')o[f.k]=[...el.selectedOptions].map(x=>x.value);
    else if(f.t==='number'){o[f.k]=el.value===''?(f.nullable?null:0):+el.value}
    else o[f.k]=el.value.trim()});
  return o;
}
function formModal({title,fields,values={},ok='Enregistrer',onSave,extraFoot='',pre=''}){
  const body=`${pre}<form id="mform" class="form">${fields.map(f=>fieldHTML(f,values[f.k])).join('')}<button type="submit" hidden></button></form>`;
  openModal({title,body,foot:`${extraFoot}<button class="btn" data-act="modal-close">Annuler</button><button class="btn pri" data-act="modal-ok">${ok}</button>`});
  const form=$('#mform');
  const go=()=>{if(!form.reportValidity())return;const r=onSave(readForm(form,fields));if(r!==false)closeModal()};
  form.addEventListener('submit',e=>{e.preventDefault();go()});$('[data-act=modal-ok]').addEventListener('click',e=>{e.stopPropagation();go()});
}
function confirmBox(msg,onYes,label='Supprimer'){
  openModal({title:'Confirmation',body:`<p style="margin:0">${msg}</p>`,foot:`<button class="btn" data-act="modal-close">Annuler</button><button class="btn pri" id="cfyes" style="background:var(--bad);border-color:var(--bad);color:#fff">${label}</button>`});
  $('#cfyes').addEventListener('click',e=>{e.stopPropagation();closeModal();onYes()});
}

/* ----- Graphiques ----- */
function donut(c){
  const tot=c.ok+c.warn+c.bad+c.idle,R=52,L=2*Math.PI*R;let off=0;
  const seg=(k,col)=>{if(!c[k])return '';const len=c[k]/tot*L;const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--${col})" stroke-width="16" stroke-dasharray="${len} ${L-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s};
  return `<svg class="chart" viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Répartition de la santé des projets"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--idle-soft)" stroke-width="16"/>${tot?seg('ok','ok')+seg('warn','warn')+seg('bad','bad')+seg('idle','idle'):''}<text x="70" y="68" text-anchor="middle" style="font:700 26px var(--f-display);fill:var(--ink)">${tot}</text><text x="70" y="86" text-anchor="middle">projets</text></svg>`;
}
function lineChart(series,{h=180,fmt=v=>nf.format(v),min=0,max}={}){
  const pts=series.flatMap(s=>s.pts);if(pts.length<2)return '<div class="muted sm">Pas assez de points d’historique. Enregistrez un point d’avancement chaque semaine pour voir la courbe.</div>';
  const w=640,pl=44,pr=14,pt=10,pb=24;const xs=pts.map(p=>p.x);const x0=Math.min(...xs),x1=Math.max(...xs);let y1=max!=null?max:Math.max(...pts.map(p=>p.y))*1.08||1,y0=min;
  const X=x=>pl+(x1===x0?0:(x-x0)/(x1-x0))*(w-pl-pr),Y=y=>pt+(1-(y-y0)/((y1-y0)||1))*(h-pt-pb);
  let g='';for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=Y(v);g+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
  const xt=[x0,Math.round((x0+x1)/2),x1].map((x,i)=>`<text x="${X(x)}" y="${h-6}" text-anchor="${i===0?'start':i===2?'end':'middle'}">${fshort(x)}</text>`).join('');
  const lines=series.map(s=>{const d=s.pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');const e=s.pts[s.pts.length-1];
    return `<path d="${d}" fill="none" stroke="var(--${s.c})" stroke-width="2.2" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/><circle cx="${X(e.x)}" cy="${Y(e.y)}" r="4" fill="var(--${s.c})"/>`}).join('');
  const lg=series.map(s=>`<span><i style="background:var(--${s.c})"></i>${esc(s.n)}</span>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" role="img" aria-label="Courbe d’évolution">${g}${xt}${lines}</svg><div class="legend">${lg}</div>`;
}
function budgetBars(items){
  if(!items.length)return '<div class="muted sm">Aucun budget saisi.</div>';
  const mx=Math.max(...items.map(i=>Math.max(i.B,i.eac,1)));const P=v=>(v/mx*100).toFixed(2);
  return items.map(i=>{const over=i.eac>i.B&&i.B>0;
    return `<div class="bb"><div class="bl" title="${esc(i.label)}">${esc(i.label)}</div><div class="bt"><i class="ac" style="width:${P(Math.min(i.actual,i.eac))}%"></i>${i.eac>i.actual?`<i class="ea" style="left:${P(i.actual)}%;width:${P(Math.min(i.eac,i.B>0?Math.max(i.B,i.actual):i.eac)-i.actual)}%"></i>`:''}${over?`<i class="ov" style="left:${P(Math.max(i.B,i.actual))}%;width:${P(i.eac-Math.max(i.B,i.actual))}%"></i>`:''}<b style="left:${P(i.B)}%" title="Budget"></b></div><div class="num sm" style="text-align:right">${esc(i.txt||'')}</div></div>`}).join('')
   +`<div class="legend" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Consommé</span><span><i style="background:var(--bar-bg)"></i>Reste à faire</span><span><i style="background:var(--bad)"></i>Dépassement prévu</span><span><i style="background:var(--ink);width:3px;height:11px"></i>Budget approuvé</span></div>`;
}
function riskHeat(risks){
  const cnt={};risks.filter(rOpen).forEach(r=>{const k=r.prob+'-'+r.imp;cnt[k]=(cnt[k]||0)+1});
  const bg=s=>s>=15?'var(--bad-soft);color:var(--bad)':s>=10?'var(--warn-soft);color:var(--warn)':s>=5?'var(--accent-soft);color:var(--accent)':'var(--ok-soft);color:var(--ok)';
  let h='<div class="heat" role="table" aria-label="Matrice des risques ouverts">';
  for(let p=5;p>=1;p--){h+=`<div class="h">P${p}</div>`;for(let i=1;i<=5;i++){const c=cnt[p+'-'+i]||0;h+=`<div style="background:${bg(p*i)}" title="Probabilité ${p} × Impact ${i}">${c||''}</div>`}}
  h+='<div class="h"></div>'+[1,2,3,4,5].map(i=>`<div class="h">I${i}</div>`).join('')+'</div>';return h;
}

/* ----- Gantt ----- */
function ganttHTML(rows,{zoom='week',links=[],names='Tâche',pid=null}={}){
  const px={day:22,week:9,month:3.2}[zoom]||9,RH=30,t0=today();
  const ok=rows.filter(r=>!isNaN(r.start)&&!isNaN(r.end));
  if(!ok.length)return '<div class="empty">Aucune tâche datée à afficher.</div>';
  let min=Math.min(...ok.map(r=>r.start)),max=Math.max(...ok.map(r=>r.end));
  if(t0>=min-45&&t0<=max+45){min=Math.min(min,t0);max=Math.max(max,t0)}
  min-=((min+3)%7);min-=2;max+=10;
  const W=Math.ceil((max-min+1)*px),H=rows.length*RH,X=n=>(n-min)*px;
  const mon=n=>((n+3)%7===0);let hd='',gl='',we='';
  for(let n=min;n<=max;){const dt=new Date(n*DAY),y=dt.getUTCFullYear(),m=dt.getUTCMonth();const nx=Math.round(Date.UTC(y,m+1,1)/DAY),en=Math.min(nx-1,max);
    hd+=`<div class="g-hs" style="left:${X(n)}px;width:${(en-n+1)*px}px;top:0">${dt.toLocaleDateString('fr-FR',{month:'short',year:'2-digit',timeZone:'UTC'})}</div>`;
    if(zoom==='month')gl+=`<div class="g-gl" style="left:${X(n)}px"></div>`;n=en+1}
  if(zoom!=='month')for(let n=min;n<=max;n++){
    if(mon(n)){gl+=`<div class="g-gl" style="left:${X(n)}px"></div>`;hd+=`<div class="g-hs" style="left:${X(n)}px;width:${7*px}px;top:22px">${zoom==='day'?'':new Date(n*DAY).getUTCDate()}</div>`}
    if(zoom==='day'){hd+=`<div class="g-hs" style="left:${X(n)}px;width:${px}px;top:22px;padding:3px 0;text-align:center">${new Date(n*DAY).getUTCDate()}</div>`;const di=dayInfo(n);if(!di.work)we+=`<div class="g-we ${di.k==='we'?'':'hol'}" style="left:${X(n)}px;width:${px}px" title="${esc(fdate(n)+' · '+di.l)}"></div>`}}
  calConflictBands:{const fz=(calCfg().events||[]).filter(x=>x.type==='freeze'&&(!x.pid||!pid||x.pid===pid)&&d2n(x.to||x.from)>=min&&d2n(x.from)<=max);
    fz.forEach(x=>{const a=Math.max(d2n(x.from),min),b=Math.min(d2n(x.to||x.from),max);we+=`<div class="g-fz" style="left:${X(a)}px;width:${(b-a+1)*px}px" title="${esc('Freeze : '+(x.label||'gel des mises en production')+' · '+fdate(x.from)+' → '+fdate(x.to||x.from))}"></div>`})}
  let nm='',bk='',bars='',idx={};
  rows.forEach((r,i)=>{
    const top=i*RH,k=r.kind;idx[r.id]=i;
    nm+=`<div class="g-nm ${k==='grp'?'grp':k==='proj'||k==='task'||k==='ms'?(r.sub?'sub':''):''}" ${r.act?`data-act="${r.act}" data-id="${esc(r.id)}"`:''} title="${esc(r.title||r.label)}">${r.rag?dot(r.rag)+' ':''}${k==='ms'?'<span style="color:var(--warn)">◆</span> ':''}<span class="c">${esc(r.label)}</span></div>`;
    bk+=`<div class="g-rb ${k==='grp'?'grp':''}" style="top:${top}px"></div>`;
    if(isNaN(r.start)||isNaN(r.end))return;
    const a=r.act?`data-act="${r.act}" data-id="${esc(r.id)}"`:'';const tt=esc((r.title||r.label)+' · '+fdate(r.start)+' → '+fdate(r.end)+(r.progress!=null?' · '+Math.round(r.progress)+' %':''));
    if(k==='grp')bars+=`<div class="g-grp" style="left:${X(r.start)}px;width:${Math.max(4,(r.end-r.start+1)*px)}px;top:${top+11}px" title="${tt}"></div>`;
    else if(k==='ms')bars+=`<div class="g-ms ${r.progress>=100?'done':''}" ${a} style="left:${X(r.end)+px/2-7}px;top:${top+8}px" title="${tt}"></div>`;
    else{const w=Math.max(5,(r.end-r.start+1)*px);(r.mss||[]).forEach(n=>{bars+=`<div class="g-ms" style="left:${X(n)+px/2-5}px;top:${top+10}px;width:10px;height:10px;z-index:1" title="Jalon · ${fdate(n)}"></div>`});bars+=`<div class="g-bar ${r.late?'late':''} ${r.progress>=100?'done':''}" ${a} style="left:${X(r.start)}px;width:${w}px;top:${top+7}px" title="${tt}"><i style="width:${clamp(r.progress||0,0,100)}%"></i></div><span class="g-lbl" style="left:${X(r.start)+w+6}px;top:${top+8}px">${Math.round(r.progress||0)} %</span>`}
  });
  let sv='';
  if(links.length){const pth=links.map(l=>{const a=rows[idx[l.from]],b=rows[idx[l.to]];if(!a||!b||isNaN(a.end)||isNaN(b.start))return '';
    const x1=a.kind==='ms'?X(a.end)+px/2+7:X(a.end+1),y1=idx[l.from]*RH+15,x2=b.kind==='ms'?X(b.end)+px/2-7:X(b.start),y2=idx[l.to]*RH+15;const mx=x1+5;
    return `<path d="M${x1} ${y1}H${mx}V${y2}H${x2-2}" fill="none" stroke="var(--ink3)" stroke-width="1"/><path d="M${x2-1} ${y2}l-4 -3v6z" fill="var(--ink3)"/>`}).join('');
    sv=`<svg class="g-svg" width="${W}" height="${H}">${pth}</svg>`}
  const td=(t0>=min&&t0<=max)?`<div class="g-today" style="left:${X(t0)+px/2-1}px" title="Aujourd’hui : ${fdate(t0)}"></div>`:'';
  return `<div class="g-wrap" tabindex="0"><div class="g-inner"><div class="g-names"><div class="g-hd">${names}</div>${nm}</div><div class="g-area" style="width:${W}px"><div class="g-hd">${hd}</div><div class="g-rows" style="height:${H}px">${bk}${we}${gl}${sv}${bars}${td}</div></div></div></div>`;
}

/* ===== Tableau de bord ===== */

  if(!list.length)return head('Tableau de bord','')+emptyPortfolio();
  const active=list.filter(p=>['En cours','Planifié','En pause'].includes(p.status));
  const watch=P.ks.filter(x=>x.p.status!=='Terminé'&&(x.k.rag.overall==='bad'||x.k.rag.overall==='warn')).sort((a,b)=>RANK[b.k.rag.overall]-RANK[a.k.rag.overall]||b.k.delay-a.k.delay);
  const spiC=P.spi>=S.settings.spiWarn?'ok':P.spi>=S.settings.spiBad?'warn':'bad';
  const cpiC=P.overrun<=S.settings.ovWarn?'ok':P.overrun<=S.settings.ovBad?'warn':'bad';
  const qs=P.q==null?null:P.q,qC=qs==null?'idle':qs>=S.settings.qWarn?'ok':qs>=S.settings.qBad?'warn':'bad';
  const dp=sum(P.ks,x=>x.p.quality?.delP),da=sum(P.ks,x=>x.p.quality?.delA),tp=sum(P.ks,x=>x.p.quality?.tstP),to=sum(P.ks,x=>x.p.quality?.tstOk);
  const delayed=P.ks.filter(x=>x.k.delay>0&&x.p.status!=='Terminé').sort((a,b)=>b.k.delay-a.k.delay).slice(0,4);
  const ms=allMilestones(list).filter(m=>d2n(m.end)>=t0&&d2n(m.end)<=t0+30&&(+m.progress||0)<100).sort((a,b)=>d2n(a.end)-d2n(b.end)).slice(0,8);
  const msLate=allMilestones(list).filter(m=>d2n(m.end)<t0&&(+m.progress||0)<100&&!['Terminé'].includes(S.projects[m.pid].status)).length;
  const bb=[...P.ks].filter(x=>x.k.B>0).sort((a,b)=>b.k.EAC-a.k.EAC).slice(0,8).map(x=>({label:x.p.code+' · '+x.p.name,B:x.k.B,actual:x.k.AC,eac:x.k.EAC,txt:pct(x.k.AC/x.k.B*100)}));
  return head('Tableau de bord',`${todayTxt()} · ${list.length} projets suivis, ${active.length} actifs`,`<button class="btn" data-act="go-report" data-kind="weekly">Rapport hebdomadaire</button><button class="btn pri" data-act="proj-new">+ Nouveau projet</button>`)+
  `<div class="grid g4">${tile('Projets actifs',active.length,`${list.filter(p=>p.status==='En cours').length} en cours · ${list.filter(p=>p.status==='Planifié').length} planifiés · ${list.filter(p=>p.status==='Terminé').length} terminés`)}
   ${tile('Budget approuvé',moneyC(P.B),`Consommé ${moneyC(P.AC)} (${pct(P.B?P.AC/P.B*100:0)})`)}
   ${tile('Projets critiques',P.rag.bad,`${P.rag.warn} à surveiller · ${P.rag.ok} maîtrisés`,P.rag.bad?'bad':'ok')}
   ${tile('Risques critiques ouverts',P.crit,`${P.risksOpen} risques ouverts au total`,P.crit?'bad':'ok')}</div>
  <div class="grid g3">
   <section class="card"><header><div><h2>Délai</h2><p>Avancement réel contre planifié</p></div>${ragPill(spiC)}</header><div class="body" style="display:flex;flex-direction:column;gap:10px">
     <div class="sp"><span class="muted">SPI du portefeuille</span><b class="num" style="font-size:22px">${nf2.format(P.spi)}</b></div>
     <div><div class="sp sm"><span>Réel</span><span class="num">${pct(P.actual)}</span></div>${barHTML(P.actual,spiC)}</div>
     <div><div class="sp sm"><span>Planifié</span><span class="num">${pct(P.planned)}</span></div>${barHTML(P.planned)}</div>
     <div class="sm muted">${P.late} projet${P.late>1?'s':''} en retard critique · ${P.lateW} à surveiller${msLate?` · ${msLate} jalon${msLate>1?'s':''} dépassé${msLate>1?'s':''}`:''}</div>
     ${delayed.length?`<ul class="list sm">${delayed.map(x=>`<li><span>${projLink(x.p)}</span><span class="pill bad">+${x.k.delay} j</span></li>`).join('')}</ul>`:'<div class="sm muted">Aucun retard prévisionnel.</div>'}</div></section>
   <section class="card"><header><div><h2>Budget</h2><p>Consommation et prévision à terminaison</p></div>${ragPill(cpiC)}</header><div class="body" style="display:flex;flex-direction:column;gap:10px">
     <div class="sp"><span class="muted">CPI du portefeuille</span><b class="num" style="font-size:22px">${nf2.format(P.cpi)}</b></div>
     <div class="sp sm"><span>Prévision à terminaison (EAC)</span><b class="num">${moneyC(P.EAC)}</b></div>
     <div class="sp sm"><span>Écart au budget approuvé</span><b class="num" style="color:var(--${cpiC==='idle'?'ink':cpiC})">${P.overrun>0?'+':''}${nf1.format(P.overrun*100)} % (${moneyC(P.EAC-P.B)})</b></div>
     <div><div class="sp sm"><span>Consommé</span><span class="num">${pct(P.B?P.AC/P.B*100:0)}</span></div>${barHTML(P.B?P.AC/P.B*100:0,cpiC)}</div>
     <div class="sm muted">${P.ks.filter(x=>x.k.rag.budget==='bad').length} projet(s) en dépassement critique · ${P.ks.filter(x=>x.k.rag.budget==='warn').length} à surveiller</div></div></section>
   <section class="card"><header><div><h2>Qualité</h2><p>Livrables, tests et anomalies</p></div>${ragPill(qC)}</header><div class="body" style="display:flex;flex-direction:column;gap:10px">
     <div class="sp"><span class="muted">Score moyen</span><b class="num" style="font-size:22px">${qs==null?'n/d':Math.round(qs)+' / 100'}</b></div>
     <div><div class="sp sm"><span>Livrables acceptés</span><span class="num">${dp?pct(da/dp*100):'n/d'}</span></div>${barHTML(dp?da/dp*100:0)}</div>
     <div><div class="sp sm"><span>Tests réussis</span><span class="num">${tp?pct(to/tp*100):'n/d'}</span></div>${barHTML(tp?to/tp*100:0)}</div>
     <div class="sm muted">${P.defects} anomalies critiques et majeures ouvertes · ${P.qBad} projet(s) sous le seuil de qualité</div></div></section></div>
  <div class="grid g2">
   <section class="card"><header><div><h2>Santé du portefeuille</h2><p>Statut global automatique, hors projets terminés</p></div></header><div class="body" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">${donut(P.rag)}<ul class="list grow" style="min-width:200px">${[['ok','Maîtrisés'],['warn','À surveiller'],['bad','Critiques'],['idle','Non évalués']].map(([k,l])=>`<li><span>${dot(k)} ${l}</span><b class="num">${P.rag[k]}</b></li>`).join('')}</ul></div></section>
   <section class="card"><header><div><h2>Matrice des risques</h2><p>Risques ouverts, probabilité × impact</p></div><button class="btn sm" data-act="nav" data-v="risk">Voir le registre</button></header><div class="body">${riskHeat(allRisks(list))}</div></section></div>
  <section class="card"><header><div><h2>Projets à surveiller</h2><p>Triés par gravité puis par retard prévisionnel</p></div></header>${watch.length?`<div class="tw"><table><thead><tr><th>Projet</th><th>Chef de projet</th><th class="c">Délai</th><th class="c">Budget</th><th class="c">Qualité</th><th class="r">SPI</th><th class="r">CPI</th><th>Points d’attention</th></tr></thead><tbody>${watch.slice(0,12).map(x=>`<tr class="click" data-act="open" data-id="${esc(x.p.id)}"><td><b>${esc(x.p.name)}</b><div class="sm muted">${esc(x.p.code)} · ${esc(x.p.type)}</div></td><td>${esc(x.p.manager)}</td><td class="c">${dot(x.k.rag.schedule)}</td><td class="c">${dot(x.k.rag.budget)}</td><td class="c">${dot(x.k.rag.quality)}</td><td class="r num">${nf2.format(x.k.spi)}</td><td class="r num">${nf2.format(x.k.cpi)}</td><td class="sm">${esc(reasons(x.k).join(' · '))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aucun projet à surveiller. Tout est dans les clous.</div>'}</section>
  <div class="grid g2">
   <section class="card"><header><div><h2>Budget par projet</h2><p>Les 8 plus gros projets</p></div><button class="btn sm" data-act="nav" data-v="budget">Détail budget</button></header><div class="body">${budgetBars(bb)}</div></section>
   <section class="card"><header><div><h2>Jalons des 30 prochains jours</h2></div></header><div class="body">${ms.length?`<ul class="list">${ms.map(m=>`<li><span><b>${esc(m.name)}</b><div class="sm muted">${esc(m.pcode)} · ${esc(m.pname)}</div></span><span class="pill ${d2n(m.end)-t0<=7?'warn':''}">${fdate(m.end)}</span></li>`).join('')}</ul>`:'<div class="muted">Aucun jalon prévu dans les 30 jours.</div>'}</div>
     <header style="border-top:1px solid var(--line)"><div><h2>Calendrier à venir</h2><p>Fériés, fermetures et freeze des 60 prochains jours</p></div><button class="btn sm" data-act="nav" data-v="cal">Ouvrir</button></header><div class="body">${calUpcoming(t0)}</div></section></div>`;
};
function calUpcoming(t0){
  const items=[];let cur=null;
  for(let n=t0;n<=t0+60;n++){const di=dayInfo(n);if(!di.work&&di.k&&di.k!=='we'){if(cur&&cur.l===di.l&&cur.b===n-1)cur.b=n;else{cur={a:n,b:n,l:di.l,k:di.k};items.push(cur)}}}
  (calCfg().events||[]).filter(e=>e.type==='freeze'&&d2n(e.to||e.from)>=t0&&d2n(e.from)<=t0+60).forEach(e=>items.push({a:Math.max(d2n(e.from),t0),b:d2n(e.to||e.from),l:e.label||'Freeze',k:'freeze'}));
  items.sort((x,y)=>x.a-y.a);
  const wd=workDays(t0,t0+29);
  const li=items.slice(0,6).map(i=>`<li><span>${i.k==='freeze'?'<span class="pill warn">Freeze</span> ':''}<b>${esc(i.l)}</b></span><span class="sm num">${i.a===i.b?wdName(i.a).slice(0,3)+' '+fshort(i.a):fshort(i.a)+' → '+fshort(i.b)}</span></li>`).join('');
  return (li?`<ul class="list">${li}</ul>`:'<div class="muted">Aucun jour chômé ni freeze dans les 60 jours.</div>')+`<div class="sm muted" style="margin-top:8px">${wd} jours ouvrés sur les 30 prochains jours (${nfH(wd*dayHours())})</div>`}
const emptyPortfolio=()=>`<div class="card"><div class="empty"><h2>Votre portefeuille est vide</h2><p style="margin:0;max-width:52ch">Créez un premier projet ou importez votre classeur Excel actuel. Le Gantt, le budget, les risques et les rapports se construisent ensuite automatiquement.</p><div class="row" style="justify-content:center"><button class="btn pri" data-act="proj-new">+ Nouveau projet</button><button class="btn" data-act="nav" data-v="data">Importer depuis Excel</button></div></div></div>`;
ACT['go-report']=d=>{V.view='rep';V.rep.kind=d.kind||'weekly';V.rep.scope=d.pid?'project':'portfolio';V.rep.pid=d.pid||'';render()};

/* ===== Portefeuille ===== */
const SORTS={name:x=>x.p.name.toLowerCase(),code:x=>x.p.code,manager:x=>(x.p.manager||'').toLowerCase(),status:x=>STATUSES.indexOf(x.p.status),prio:x=>PRIORITIES.indexOf(x.p.priority),rag:x=>-RANK[x.k.rag.overall],prog:x=>x.k.actual,spi:x=>x.k.spi,cpi:x=>x.k.cpi,budget:x=>x.k.B,eac:x=>x.k.EAC,end:x=>d2n(x.p.end)};
VIEWS.port=()=>{
  const all=listProjects();const mgrs=[...new Set(plist().map(p=>p.manager).filter(Boolean))].sort();
  let rows=plist().map(p=>({p,k:kpi(p)}));
  if(V.q){const q=V.q.toLowerCase();rows=rows.filter(x=>(x.p.name+' '+x.p.code+' '+x.p.manager+' '+x.p.sponsor).toLowerCase().includes(q))}
  if(V.fStatus)rows=rows.filter(x=>x.p.status===V.fStatus);else rows=rows.filter(x=>x.p.status!=='Annulé'||V.fStatus==='Annulé');
  if(V.fType)rows=rows.filter(x=>x.p.type===V.fType);if(V.fRag)rows=rows.filter(x=>x.k.rag.overall===V.fRag);if(V.fMgr)rows=rows.filter(x=>x.p.manager===V.fMgr);
  const f=SORTS[V.sort]||SORTS.name;rows.sort((a,b)=>{const x=f(a),y=f(b);return (x>y?1:x<y?-1:0)*V.dir});
  const th=(k,l,c='')=>`<th class="${c}"><button class="btn ghost sm" style="padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit" data-act="sort" data-k="${k}">${l}${V.sort===k?(V.dir>0?' ▲':' ▼'):''}</button></th>`;
  const types=[...new Set([...S.settings.types,...plist().map(p=>p.type)])];
  const tb=rows.map(({p,k})=>`<tr class="click" data-act="open" data-id="${esc(p.id)}"><td class="mono sm">${esc(p.code)}</td><td><b>${esc(p.name)}</b><div class="sm muted">${esc(p.type)}${p.demo?' · exemple':''}</div></td><td>${esc(p.manager)}</td><td>${statusPill(p.status)}</td><td class="c">${dot(k.rag.schedule,'Délai : '+RAGL[k.rag.schedule])}</td><td class="c">${dot(k.rag.budget,'Budget : '+RAGL[k.rag.budget])}</td><td class="c">${dot(k.rag.quality,'Qualité : '+RAGL[k.rag.quality])}</td><td>${ragPill(k.rag.overall)}</td><td style="min-width:130px">${barHTML(k.actual,k.rag.schedule==='bad'?'bad':k.rag.schedule==='warn'?'warn':'')}<div class="sm muted num">${Math.round(k.actual)} % réel · ${Math.round(k.planned)} % plan</div></td><td class="r num">${nf2.format(k.spi)}</td><td class="r num">${nf2.format(k.cpi)}</td><td class="r num">${moneyC(k.B)}</td><td class="r num">${moneyC(k.EAC)}</td><td class="num sm">${fdate(p.end)}${k.delay?`<div style="color:var(--bad)">+${k.delay} j</div>`:''}</td></tr>`).join('');
  return head('Portefeuille',`${rows.length} projet${rows.length>1?'s':''} affiché${rows.length>1?'s':''} sur ${plist().length}`,`<button class="btn" data-act="x-port">Exporter en Excel</button><button class="btn pri" data-act="proj-new">+ Nouveau projet</button>`)+
  `<div class="filters"><input id="q" type="search" placeholder="Rechercher un projet, un code, une personne" value="${esc(V.q)}" data-f="q" style="min-width:min(100%,280px)" aria-label="Rechercher">
   <select data-f="fStatus" aria-label="Statut">${optsHTML(STATUSES,V.fStatus,'Tous les statuts actifs')}</select>
   <select data-f="fType" aria-label="Type">${optsHTML(types,V.fType,'Tous les types')}</select>
   <select data-f="fRag" aria-label="Santé">${optsHTML([['ok','Maîtrisés'],['warn','À surveiller'],['bad','Critiques']],V.fRag,'Toute santé')}</select>
   <select data-f="fMgr" aria-label="Chef de projet">${optsHTML(mgrs,V.fMgr,'Tous les chefs de projet')}</select></div>
  <section class="card">${rows.length?`<div class="tw"><table><thead><tr>${th('code','Code')}${th('name','Projet')}${th('manager','Chef de projet')}${th('status','Statut')}<th class="c" title="Délai">Dél.</th><th class="c" title="Budget">Bud.</th><th class="c" title="Qualité">Qual.</th>${th('rag','Santé')}${th('prog','Avancement')}${th('spi','SPI','r')}${th('cpi','CPI','r')}${th('budget','Budget','r')}${th('eac','EAC','r')}${th('end','Fin prévue')}</tr></thead><tbody>${tb}</tbody><tfoot><tr><td colspan="11" class="sm muted" style="padding:8px 10px">Total affiché</td><td class="r num"><b>${moneyC(sum(rows,x=>x.k.B))}</b></td><td class="r num"><b>${moneyC(sum(rows,x=>x.k.EAC))}</b></td><td></td></tr></tfoot></table></div>`:`<div class="empty">${all.length?'Aucun projet ne correspond aux filtres.':'Aucun projet pour le moment.'}</div>`}</section>`;
};
ACT.sort=d=>{if(V.sort===d.k)V.dir*=-1;else{V.sort=d.k;V.dir=1}render()};

/* ===== Roadmap (Gantt du portefeuille) ===== */
VIEWS.road=()=>{
  const types=[...new Set(listProjects().map(p=>p.type))];let list=listProjects();
  if(V.fType)list=list.filter(p=>p.type===V.fType);if(V.fStatus)list=list.filter(p=>p.status===V.fStatus);
  const rows=[];
  [...new Set(list.map(p=>p.type))].forEach(ty=>{const ps=list.filter(p=>p.type===ty).sort((a,b)=>d2n(a.start)-d2n(b.start));
    rows.push({kind:'grp',label:ty+' ('+ps.length+')',id:'g'+ty,start:Math.min(...ps.map(p=>d2n(p.start))),end:Math.max(...ps.map(p=>d2n(p.end)))});
    ps.forEach(p=>{const k=kpi(p);rows.push({kind:'proj',sub:1,id:p.id,act:'open',label:p.code+' · '+p.name,title:p.name,start:d2n(p.start),end:d2n(p.end),progress:k.actual,late:k.rag.schedule==='bad',rag:k.rag.overall,mss:(p.tasks||[]).filter(t=>t.ms).map(t=>d2n(t.end))})})});
  return head('Roadmap','Vue calendaire du portefeuille : barre = durée du projet, remplissage = avancement réel, losanges = jalons',`${zoomSel(V.pzoom,'zoom-p')}<button class="btn" data-act="x-road">Exporter le Gantt en Excel</button>`)+
  `<div class="filters"><select data-f="fType" aria-label="Type">${optsHTML(types,V.fType,'Tous les types')}</select><select data-f="fStatus" aria-label="Statut">${optsHTML(STATUSES.filter(s=>s!=='Annulé'),V.fStatus,'Tous les statuts')}</select><span class="legend"><span><i style="background:var(--bar)"></i>Avancement</span><span><i style="background:var(--warn)"></i>Jalon</span><span><i style="background:var(--today);width:3px"></i>Aujourd’hui</span></span></div>
  <section class="card">${rows.length?ganttHTML(rows,{zoom:V.pzoom,names:'Projet'}):'<div class="empty">Aucun projet à afficher.</div>'}</section>`;
};
ACT['zoom-p']=d=>{V.pzoom=d.z;render()};

/* ===== Registre des risques (portefeuille) ===== */
const riskRows=(rs,showP=true)=>rs.map(r=>{const s=rScore(r),l=rLevel(s),late=rOpen(r)&&r.due&&d2n(r.due)<today();
  return `<tr class="click" data-act="risk-edit" data-pid="${esc(r.pid)}" data-id="${esc(r.id)}">${showP?`<td class="sm"><span class="mono">${esc(r.pcode)}</span><div class="muted">${esc(r.pname)}</div></td>`:''}<td style="min-width:220px"><b>${esc(r.title)}</b><div class="sm muted">${esc(r.mitigation||'')}</div></td><td>${esc(r.cat)}</td><td class="c num">${r.prob}</td><td class="c num">${r.imp}</td><td class="c"><span class="pill ${l.c}">${s} · ${l.k}</span></td><td>${esc(r.owner||'')}</td><td>${esc(r.resp||'')}</td><td class="num sm"${late?' style="color:var(--bad);font-weight:600"':''}>${r.due?fdate(r.due):''}</td><td><span class="pill ${r.status==='Clos'?'ok':r.status==='Matérialisé'?'bad':r.status==='En traitement'?'acc':''}">${esc(r.status)}</span></td></tr>`}).join('');
const riskHead=(showP=true)=>`<thead><tr>${showP?'<th>Projet</th>':''}<th>Risque</th><th>Catégorie</th><th class="c">P</th><th class="c">I</th><th class="c">Score</th><th>Responsable</th><th>Réponse</th><th>Échéance</th><th>Statut</th></tr></thead>`;
VIEWS.risk=()=>{
  let rs=allRisks();const open=rs.filter(rOpen);
  if(V.rkStatus==='open')rs=open;else if(V.rkStatus==='closed')rs=rs.filter(r=>r.status==='Clos');if(V.rkProj)rs=rs.filter(r=>r.pid===V.rkProj);if(V.rkLvl)rs=rs.filter(r=>rLevel(rScore(r)).k===V.rkLvl);
  rs.sort((a,b)=>rScore(b)-rScore(a));
  const crit=open.filter(r=>rScore(r)>=15).length,high=open.filter(r=>rScore(r)>=10&&rScore(r)<15).length,mat=open.filter(r=>r.status==='Matérialisé').length,late=open.filter(r=>r.due&&d2n(r.due)<today()).length;
  return head('Registre des risques','Tous projets confondus, triés par score (probabilité × impact)',`<button class="btn" data-act="x-risks">Exporter en Excel</button><button class="btn pri" data-act="risk-new" data-pid="">+ Nouveau risque</button>`)+
  `<div class="grid g4">${tile('Risques ouverts',open.length,'dont '+mat+' matérialisé(s)')}${tile('Critiques (≥ 15)',crit,'Action immédiate',crit?'bad':'ok')}${tile('Élevés (10 à 14)',high,'Plan de réponse suivi',high?'warn':'ok')}${tile('Échéances dépassées',late,'Réponses à relancer',late?'bad':'ok')}</div>

  <section class="card"><header><h2>Par catégorie</h2></header><div class="body">${RISK_CATS.map(c=>{const n=open.filter(r=>r.cat===c).length;return `<div class="bb"><div class="bl">${c}</div><div class="bt"><i class="ac" style="width:${open.length?n/open.length*100:0}%"></i></div><div class="num sm">${n}</div></div>`}).join('')}</div></section></div>
  <div class="filters"><select data-f="rkStatus" aria-label="Statut">${optsHTML([['open','Risques ouverts'],['all','Tous'],['closed','Clos']],V.rkStatus)}</select><select data-f="rkProj" aria-label="Projet">${optsHTML(listProjects().map(p=>[p.id,p.code+' · '+p.name]),V.rkProj,'Tous les projets')}</select><select data-f="rkLvl" aria-label="Niveau">${optsHTML(['Critique','Élevé','Moyen','Faible'],V.rkLvl||'','Tous les niveaux')}</select></div>

  const list=listProjects();const P=portfolio(list);const rows=P.ks.filter(x=>x.k.bd.has);
  const bytype=[...new Set(list.map(p=>p.type))].map(t=>{const x=P.ks.filter(y=>y.p.type===t);return{t,n:x.length,B:sum(x,y=>y.k.B),AC:sum(x,y=>y.k.AC),EAC:sum(x,y=>y.k.EAC),com:sum(x,y=>y.k.bd.committed)}});
  const cats={};list.forEach(p=>(p.lines||[]).forEach(l=>{const c=cats[l.cat]||(cats[l.cat]={planned:0,committed:0,actual:0,eac:0});c.planned+=+l.planned||0;c.committed+=+l.committed||0;c.actual+=+l.actual||0;c.eac+=(+l.actual||0)+lineEtc(l)})); 
  const ov=P.overrun>S.settings.ovBad?'bad':P.overrun>S.settings.ovWarn?'warn':'ok';
  return head('Budget du portefeuille','Budget approuvé, engagé, consommé et prévision à terminaison (EAC)',`<button class="btn" data-act="x-budget">Exporter en Excel</button>`)+
  `<div class="grid g4">${tile('Budget approuvé',moneyC(P.B),money(P.B))}${tile('Consommé',moneyC(P.AC),pct(P.B?P.AC/P.B*100:0)+' du budget')}${tile('Prévision (EAC)',moneyC(P.EAC),'Consommé + reste à faire')}${tile('Écart prévisionnel',(P.EAC-P.B>0?'+':'')+moneyC(P.EAC-P.B),(P.overrun>0?'+':'')+nf1.format(P.overrun*100)+' % · CPI '+nf2.format(P.cpi),ov)}</div>
  <section class="card"><header><div><h2>Par projet</h2><p>Triés par prévision à terminaison</p></div></header><div class="tw"><table><thead><tr><th>Projet</th><th>Santé budget</th><th class="r">Budget</th><th class="r">Engagé</th><th class="r">Consommé</th><th class="r">Reste à faire</th><th class="r">EAC</th><th class="r">Écart</th><th class="r">CPI</th><th style="min-width:110px">Consommation</th></tr></thead><tbody>${[...rows].sort((a,b)=>b.k.EAC-a.k.EAC).map(({p,k})=>`<tr class="click" data-act="open" data-id="${esc(p.id)}" data-tab="budget"><td><b>${esc(p.name)}</b><div class="sm muted">${esc(p.code)}</div></td><td>${ragPill(k.rag.budget)}</td><td class="r num">${money(k.B)}</td><td class="r num">${money(k.bd.committed)}</td><td class="r num">${money(k.AC)}</td><td class="r num">${money(k.bd.etc)}</td><td class="r num">${money(k.EAC)}</td><td class="r num" style="color:var(--${k.overrun>S.settings.ovWarn?'bad':'ok'})">${k.EAC-k.B>0?'+':''}${money(k.EAC-k.B)}</td><td class="r num">${nf2.format(k.cpi)}</td><td>${barHTML(k.bd.conso,k.rag.budget)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2"><b>Total</b></td><td class="r num"><b>${money(P.B)}</b></td><td class="r num"><b>${money(sum(P.ks,x=>x.k.bd.committed))}</b></td><td class="r num"><b>${money(P.AC)}</b></td><td class="r num"><b>${money(P.EAC-P.AC)}</b></td><td class="r num"><b>${money(P.EAC)}</b></td><td class="r num"><b>${P.EAC-P.B>0?'+':''}${money(P.EAC-P.B)}</b></td><td class="r num"><b>${nf2.format(P.cpi)}</b></td><td></td></tr></tfoot></table></div></section>
  <div class="grid g2"><section class="card"><header><h2>Par type de projet</h2></header><div class="tw"><table><thead><tr><th>Type</th><th class="r">Projets</th><th class="r">Budget</th><th class="r">Consommé</th><th class="r">EAC</th></tr></thead><tbody>${bytype.map(t=>`<tr><td>${esc(t.t)}</td><td class="r num">${t.n}</td><td class="r num">${moneyC(t.B)}</td><td class="r num">${moneyC(t.AC)}</td><td class="r num">${moneyC(t.EAC)}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><header><h2>Par catégorie de dépense</h2></header><div class="tw"><table><thead><tr><th>Catégorie</th><th class="r">Prévu</th><th class="r">Consommé</th><th class="r">EAC</th></tr></thead><tbody>${Object.entries(cats).sort((a,b)=>b[1].planned-a[1].planned).map(([c,v])=>`<tr><td>${esc(c)}</td><td class="r num">${moneyC(v.planned)}</td><td class="r num">${moneyC(v.actual)}</td><td class="r num">${moneyC(v.eac)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucune ligne budgétaire.</td></tr>'}</tbody></table></div></section></div>`;
};

VIEWS.proj=()=>{

   `${statusPill(p.status)}${ragPill(k.rag.overall)}<button class="btn" data-act="proj-edit">Modifier</button><button class="btn" data-act="go-report" data-kind="weekly" data-pid="${esc(p.id)}">Rapport</button><button class="btn" data-act="x-proj">Exporter en Excel</button><button class="btn pri" data-act="upd-new">Point d’avancement</button>`)+
  `<div class="tabs" role="tablist">${PTABS.map(t=>`<button role="tab" data-act="ptab" data-t="${t[0]}" aria-selected="${V.tab===t[0]}">${t[1]}${t[0]==='risks'&&k.risks.open?` <span class="pill ${k.risks.crit?'bad':''}">${k.risks.open}</span>`:''}</button>`).join('')}</div>`+PT[V.tab](p,k);

ACT.ptab=d=>{V.tab=d.t;render()};
const kv=a=>`<dl class="kv">${a.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const PT={};

PT.summary=(p,k)=>{
  const ups=[...(p.updates||[])].filter(u=>u.snap).sort((a,b)=>d2n(a.date)-d2n(b.date));const t0=today();
  let pl=ups.map(u=>({x:d2n(u.date),y:u.snap.planned})),ac=ups.map(u=>({x:d2n(u.date),y:u.snap.actual}));
  if(ups.length&&d2n(ups[0].date)>d2n(p.start)){pl.unshift({x:d2n(p.start),y:0});ac.unshift({x:d2n(p.start),y:0})}
  if(ups.length){pl.push({x:t0,y:k.planned});ac.push({x:t0,y:k.actual})}
  const late=(p.tasks||[]).filter(t=>!t.ms&&isLate(t)).sort((a,b)=>d2n(a.end)-d2n(b.end)).slice(0,5);
  const nms=(p.tasks||[]).filter(t=>t.ms&&(+t.progress||0)<100).sort((a,b)=>d2n(a.end)-d2n(b.end)).slice(0,5);
  const rk=(p.risks||[]).filter(rOpen).sort((a,b)=>rScore(b)-rScore(a)).slice(0,5);
  const dl=k.daysLeft;
  return `<div class="grid g4">
   ${tile('Délai '+dot(k.rag.schedule),'SPI '+nf2.format(k.spi),`${Math.round(k.actual)} % réel · ${Math.round(k.planned)} % plan<br>Fin prévue ${fdate(p.end)}${k.delay?` <b style="color:var(--bad)">(+${k.delay} j)</b>`:''}`)}
   ${tile('Budget '+dot(k.rag.budget),k.bd.has?'CPI '+nf2.format(k.cpi):'n/d',k.bd.has?`EAC ${moneyC(k.EAC)} / ${moneyC(k.B)}<br>Écart ${k.overrun>0?'+':''}${nf1.format(k.overrun*100)} %`:'Aucune ligne budgétaire')}
   ${tile('Qualité '+dot(k.rag.quality),k.qs==null?'n/d':Math.round(k.qs)+' / 100',k.qs==null?'Saisir les indicateurs dans l’onglet Qualité':`${+p.quality.defC||0} crit. · ${+p.quality.defM||0} maj. ouvertes`)}
   ${tile('Risques '+dot(k.rag.risk),k.risks.open+' ouverts',k.risks.crit?`<b style="color:var(--bad)">${k.risks.crit} critique(s)</b> · score max ${k.risks.max}`:`Score max ${k.risks.max||0}`)}</div>
  <div class="grid g2"><section class="card"><header><h2>Fiche projet</h2><button class="btn sm" data-act="proj-edit">Modifier</button></header><div class="body">${kv([['Statut',statusPill(p.status)],['Priorité',esc(p.priority)],['Période',`${fdate(p.start)} → ${fdate(p.end)}`],['Échéance',dl==null?'':p.status==='Terminé'?'Terminé':dl>=0?`dans ${dl} jours`:`dépassée de ${-dl} jours`],['Santé globale',ragPill(k.rag.overall)+(k.rag.manual?' <span class="sm muted">(forcée manuellement)</span>':' <span class="sm muted">(calcul automatique)</span>')],['Budget approuvé',money(k.B)],['Tâches',`${k.done} terminées sur ${(p.tasks||[]).filter(t=>!t.ms).length}`+(k.late?` · <b style="color:var(--bad)">${k.late} en retard</b>`:'')]])}
    ${p.objectives?`<h3 style="margin-top:14px">Objectifs</h3><p style="margin:4px 0 0">${esc(p.objectives)}</p>`:''}${p.description?`<h3 style="margin-top:12px">Description</h3><p style="margin:4px 0 0">${esc(p.description)}</p>`:''}</div></section>
  <section class="card"><header><div><h2>Avancement planifié et réel</h2><p>Alimenté par les points d’avancement</p></div></header><div class="body">${lineChart([{n:'Planifié',c:'ink3',dash:1,pts:pl},{n:'Réel',c:'accent',pts:ac}],{max:100,fmt:v=>Math.round(v)+'%'})}</div></section></div>
  <div class="grid g3"><section class="card"><header><h2>Jalons à venir</h2></header><div class="body">${nms.length?`<ul class="list">${nms.map(t=>`<li><span>◆ ${esc(t.name)}</span><span class="pill ${d2n(t.end)<t0?'bad':''}">${fdate(t.end)}</span></li>`).join('')}</ul>`:'<span class="muted">Aucun jalon à venir.</span>'}</div></section>
  <section class="card"><header><h2>Tâches en retard</h2></header><div class="body">${late.length?`<ul class="list">${late.map(t=>`<li><span>${esc(t.name)}<div class="sm muted">${esc(t.owner||'')}</div></span><span class="pill bad">${t0-d2n(t.end)} j · ${Math.round(t.progress||0)} %</span></li>`).join('')}</ul>`:'<span class="muted">Aucune tâche en retard.</span>'}</div></section>
  <section class="card"><header><h2>Risques principaux</h2></header><div class="body">${rk.length?`<ul class="list">${rk.map(r=>{const l=rLevel(rScore(r));return `<li><span>${esc(r.title)}</span><span class="pill ${l.c}">${rScore(r)}</span></li>`}).join('')}</ul>`:'<span class="muted">Aucun risque ouvert.</span>'}</div></section></div>`;
};

PT.plan=(p,k)=>{
  const ts=p.tasks||[],rows=[],links=[];
  phases(p).forEach(ph=>{const x=ts.filter(t=>(t.phase||'Sans phase')===ph);const dated=x.filter(t=>!isNaN(d2n(t.start)));if(!dated.length)return;
    const w=sum(x.filter(t=>!t.ms),t=>Math.max(1,d2n(t.end)-d2n(t.start)+1))||1;
    rows.push({kind:'grp',id:'ph:'+ph,label:ph,start:Math.min(...dated.map(t=>d2n(t.start))),end:Math.max(...dated.map(t=>d2n(t.end)))});
    x.forEach(t=>{rows.push({kind:t.ms?'ms':'task',sub:1,id:t.id,act:'task-edit',label:t.name,title:t.name,start:d2n(t.start),end:d2n(t.end),progress:+t.progress||0,late:!t.ms&&isLate(t)});(t.deps||[]).forEach(d=>links.push({from:d,to:t.id}))})});
  const byId=Object.fromEntries(ts.map(t=>[t.id,t]));const num=Object.fromEntries(ts.map((t,i)=>[t.id,i+1]));const t0=today();
  const trs=phases(p).map(ph=>`<tr><td colspan="9" style="background:var(--surface2);font-weight:600">${esc(ph)}</td></tr>`+ts.map((t,i)=>({t,i})).filter(x=>(x.t.phase||'Sans phase')===ph).map(({t,i})=>{const late=!t.ms&&isLate(t);
    return `<tr><td class="num muted sm">${i+1}</td><td>${t.ms?'<span style="color:var(--warn)">◆</span> ':''}<a href="#" data-act="task-edit" data-id="${esc(t.id)}" style="color:inherit"><b>${esc(t.name)}</b></a></td><td class="sm">${esc(t.owner||'')}</td><td class="num sm">${fdate(t.start)}</td><td class="num sm"${late?' style="color:var(--bad);font-weight:600"':''}>${fdate(t.end)}</td><td class="r num sm" title="${t.ms?'':taskDays(t)*dayHours()+' h de travail'}">${t.ms?'—':taskDays(t)+' j'}</td><td class="c"><input type="number" min="0" max="100" step="1" value="${Math.round(t.progress||0)}" data-chg="task-prog" data-id="${esc(t.id)}" style="width:68px;padding:3px 6px" aria-label="Avancement de ${esc(t.name)}"></td><td class="sm muted">${(t.deps||[]).map(d=>num[d]).filter(Boolean).join(', ')}</td><td class="r" style="white-space:nowrap"><button class="btn ghost sm" data-act="task-up" data-id="${esc(t.id)}" aria-label="Monter">↑</button><button class="btn ghost sm" data-act="task-down" data-id="${esc(t.id)}" aria-label="Descendre">↓</button><button class="btn ghost sm" data-act="task-dup" data-id="${esc(t.id)}" title="Dupliquer">⧉</button><button class="btn ghost sm danger" data-act="task-del" data-id="${esc(t.id)}" aria-label="Supprimer">✕</button></td></tr>`}).join('')).join('');
  return `<div class="row" style="justify-content:space-between"><div class="row"><button class="btn pri" data-act="task-new">+ Tâche</button><button class="btn" data-act="task-new" data-ms="1">+ Jalon</button><button class="btn" data-act="task-resched" title="Décale les tâches dont le prédécesseur se termine après leur début">Recalculer selon les dépendances</button></div><div class="row">${zoomSel(V.zoom,'zoom-t')}<button class="btn" data-act="x-gantt">Gantt en Excel</button></div></div>
  <section class="card">${rows.length?`<div class="body" style="padding:8px 16px"><span class="legend"><span><i style="background:var(--bar)"></i>Avancement</span><span><i style="background:var(--warn)"></i>Jalon</span><span><i style="background:var(--bad)"></i>Tâche en retard</span><span><i style="background:var(--today);width:3px"></i>Aujourd’hui</span><span><i style="background:var(--idle-soft)"></i>Jour non ouvré (échelle Jour)</span><span><i style="background:var(--warn-soft)"></i>Freeze</span></span></div>${ganttHTML(rows,{zoom:V.zoom,links,pid:p.id})}`:`<div class="empty"><b>Aucune tâche planifiée</b><span>Ajoutez des tâches et des jalons, ou importez un planning depuis Excel.</span><button class="btn pri" data-act="task-new">+ Première tâche</button></div>`}</section>
  ${ts.length?`<section class="card"><header><div><h2>Liste des tâches</h2><p>Modifiez l’avancement directement dans la colonne %</p></div></header><div class="tw"><table><thead><tr><th>#</th><th>Tâche</th><th>Responsable</th><th>Début</th><th>Fin</th><th class="r" title="Jours ouvrés">Durée (j ouvrés)</th><th class="c">%</th><th>Préd.</th><th></th></tr></thead><tbody>${trs}</tbody></table></div></section>`:''}`;
};
ACT['zoom-t']=d=>{V.zoom=d.z;render()};

PT.budget=(p,k)=>{
  const b=k.bd,L=p.lines||[];const cats={};L.forEach(l=>{const c=cats[l.cat]||(cats[l.cat]={B:0,actual:0,eac:0});c.B+=+l.planned||0;c.actual+=+l.actual||0;c.eac+=(+l.actual||0)+lineEtc(l)});
  return `<div class="grid g4">${tile('Budget approuvé',moneyC(b.B),'<button class="btn sm" data-act="budget-set">Modifier</button>')}${tile('Engagé',moneyC(b.committed),'Commandes et contrats signés')}${tile('Consommé',moneyC(b.actual),pct(b.conso)+' du budget')}${tile('Prévision (EAC)',moneyC(b.eac),`Écart ${b.eac-b.B>0?'+':''}${moneyC(b.eac-b.B)} (${b.overrun>0?'+':''}${nf1.format(b.overrun*100)} %)`,k.rag.budget==='idle'?'':k.rag.budget)}</div>
  <div class="grid g2"><section class="card"><header><h2>Par catégorie</h2></header><div class="body">${budgetBars(Object.entries(cats).map(([c,v])=>({label:c,B:v.B,actual:v.actual,eac:v.eac,txt:moneyC(v.eac)})))}</div></section>
  <section class="card"><header><h2>Indicateurs de coût</h2></header><div class="body">${kv([['CPI',`<b class="num">${nf2.format(k.cpi)}</b> <span class="sm muted">valeur acquise / coût réel</span>`],['Valeur acquise',money(k.EV)],['Reste à faire',money(b.etc)],['Budget non consommé',money(b.B-b.actual)],['Santé budget',ragPill(k.rag.budget)]])}<p class="sm muted" style="margin-bottom:0">Le reste à faire est calculé automatiquement (prévu − consommé) tant que vous ne le saisissez pas sur la ligne.</p></div></section></div>
  <section class="card"><header><div><h2>Lignes budgétaires</h2></div><button class="btn pri sm" data-act="line-new">+ Ligne</button></header>${L.length?`<div class="tw"><table><thead><tr><th>Catégorie</th><th>Libellé</th><th class="r">Prévu</th><th class="r">Engagé</th><th class="r">Consommé</th><th class="r">Reste à faire</th><th class="r">EAC</th><th></th></tr></thead><tbody>${L.map(l=>`<tr><td>${esc(l.cat)}</td><td>${esc(l.label||'')}</td><td class="r num">${money(l.planned)}</td><td class="r num">${money(l.committed)}</td><td class="r num">${money(l.actual)}</td><td class="r num">${money(lineEtc(l))}${(l.etc===null||l.etc===undefined||l.etc==='')?' <span class="sm muted">auto</span>':''}</td><td class="r num">${money((+l.actual||0)+lineEtc(l))}</td><td class="r" style="white-space:nowrap"><button class="btn ghost sm" data-act="line-edit" data-id="${esc(l.id)}">Modifier</button><button class="btn ghost sm danger" data-act="line-del" data-id="${esc(l.id)}" aria-label="Supprimer">✕</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2"><b>Total</b></td><td class="r num"><b>${money(b.planned)}</b></td><td class="r num"><b>${money(b.committed)}</b></td><td class="r num"><b>${money(b.actual)}</b></td><td class="r num"><b>${money(b.etc)}</b></td><td class="r num"><b>${money(b.eac)}</b></td><td></td></tr></tfoot></table></div>`:'<div class="empty">Aucune ligne budgétaire. Ajoutez les postes de dépense pour suivre la consommation.</div>'}</section>`;
};

PT.risks=(p,k)=>{
  const rs=(p.risks||[]).map(r=>({...r,pid:p.id,pcode:p.code,pname:p.name})).sort((a,b)=>(rOpen(b)-rOpen(a))||rScore(b)-rScore(a));
  return `<div class="row" style="justify-content:space-between"><span class="muted">${k.risks.open} ouverts · ${k.risks.crit} critiques</span><button class="btn pri" data-act="risk-new" data-pid="${esc(p.id)}">+ Risque</button></div>
  <div class="grid g2"><section class="card"><header><h2>Matrice</h2></header><div class="body">${riskHeat(rs)}</div></section><section class="card"><header><h2>Échelle de cotation</h2></header><div class="body sm">${kv([['Probabilité','1 rare · 2 peu probable · 3 possible · 4 probable · 5 quasi certain'],['Impact','1 négligeable · 2 mineur · 3 modéré · 4 majeur · 5 critique'],['Score','Probabilité × impact : ≥ 15 critique, 10 à 14 élevé, 5 à 9 moyen, sinon faible']])}</div></section></div>
  <section class="card">${rs.length?`<div class="tw"><table>${riskHead(false)}<tbody>${riskRows(rs,false)}</tbody></table></div>`:'<div class="empty">Aucun risque identifié. Le registre vide est un risque en soi : ajoutez-en.</div>'}</section>`;
};

PT.quality=(p,k)=>{

function snapPlan(apply){
  const t0=today();let tasks=0,projects=0;
  listProjects().filter(p=>p.status!=='Terminé').forEach(p=>{let n=0;
    (p.tasks||[]).forEach(t=>{if((+t.progress||0)>=100)return;const s=d2n(t.start),e=d2n(t.end);if(isNaN(s)||isNaN(e)||e<t0)return;if(isWork(s)&&isWork(e))return;n++;if(!apply)return;
      if(t.ms){t.start=t.end=n2d(nextWork(e));return}
      const dur=Math.max(1,workDays(s,e));
      if(s<t0){t.end=n2d(nextWork(e))}else{const ns=nextWork(s);t.start=n2d(ns);t.end=n2d(addWork(ns,dur))}});
    if(n){tasks+=n;projects++;if(apply){reschedule(p);touch(p)}}});
  return{tasks,projects};
}

/* ===== Rapports : structure commune pour l'aperçu et l'export Excel ===== */
const KIND_L={weekly:'Rapport hebdomadaire',monthly:'Rapport mensuel',global:'Rapport global'};
function repPeriod(){
  const r=V.rep;const t0=today();
  if(r.kind==='weekly'){const e=r.date?d2n(r.date):t0;return{from:e-6,to:e,label:'Semaine du '+fdate(e-6)+' au '+fdate(e)}}
  if(r.kind==='monthly'){const m=r.month||n2d(t0).slice(0,7);const [y,mo]=m.split('-').map(Number);const f=Math.round(Date.UTC(y,mo-1,1)/DAY),t=Math.round(Date.UTC(y,mo,1)/DAY)-1;
    return{from:f,to:Math.min(t,Math.max(t0,f)),full:t,label:new Date(f*DAY).toLocaleDateString('fr-FR',{month:'long',year:'numeric',timeZone:'UTC'})}}
  return{from:null,to:t0,label:'Situation au '+fdate(t0)};
}
const snapAt=(p,n)=>{const u=(p.updates||[]).filter(x=>x.snap&&d2n(x.date)<=n).sort((a,b)=>d2n(b.date)-d2n(a.date))[0];return u?u.snap:null};
const updIn=(p,a,b)=>(p.updates||[]).filter(u=>d2n(u.date)>=a&&d2n(u.date)<=b).sort((x,y)=>d2n(y.date)-d2n(x.date));
const trend=(a,b,inv)=>{if(a==null||b==null)return '';const d=b-a;if(Math.abs(d)<0.005)return '=';return (inv?d<0:d>0)?'▲':'▼'};

function buildReport(){
  const r=V.rep,per=repPeriod(),t0=today(),kind=r.kind;const secs=[];
  const proj=r.scope==='project'?S.projects[r.pid]:null;
  if(r.scope==='project'&&!proj)return{title:'Rapport',sub:'Sélectionnez un projet.',secs:[]};
  const list=proj?[proj]:listProjects();
  if(!list.length)return{title:KIND_L[kind],sub:'Aucun projet.',secs:[]};
  const P=portfolio(list);const name=proj?proj.name:'Portefeuille'+(S.settings.org?' '+S.settings.org:'');
  const title=`${KIND_L[kind]} · ${name}`;const sub=per.label;
  const ragTxt=x=>RAGL[x]||x;
  /* 1. Synthèse chiffrée */
  const kp=[['Projets suivis',list.length],['Avancement réel',pct(P.actual)],['Avancement planifié',pct(P.planned)],['SPI',nf2.format(P.spi)],['Budget approuvé',money(P.B)],['Consommé',money(P.AC)],['Prévision (EAC)',money(P.EAC)],['Écart prévisionnel',(P.overrun>0?'+':'')+nf1.format(P.overrun*100)+' %'],['CPI',nf2.format(P.cpi)],['Qualité moyenne',P.q==null?'n/d':Math.round(P.q)+' / 100'],['Risques ouverts',P.risksOpen],['Risques critiques',P.crit]];
  if(!proj)kp.splice(1,0,['Critiques / À surveiller / Maîtrisés',`${P.rag.bad} / ${P.rag.warn} / ${P.rag.ok}`]);
  secs.push({h:'Synthèse',kpis:kp});
  if(proj){const k=kpi(proj);secs[0].kpis.splice(1,0,['Santé globale',ragTxt(k.rag.overall)],['Fin prévue',fdate(proj.end)+(k.delay?` (+${k.delay} j)`:'')]);}
  /* 2. Contenu selon le type */
  if(kind==='weekly'){
    const ups=list.flatMap(p=>updIn(p,per.from,per.to).map(u=>({p,u})));
    if(!proj){
      const rows=P.ks.filter(x=>!['Terminé','Idée','Annulé'].includes(x.p.status)).sort((a,b)=>RANK[b.k.rag.overall]-RANK[a.k.rag.overall]).map(({p,k})=>{const prev=snapAt(p,per.from-1);
        return [p.code,p.name,p.manager,ragTxt(k.rag.overall),Math.round(k.actual)+' % / '+Math.round(k.planned)+' %',nf2.format(k.spi)+' '+trend(prev&&prev.spi,k.spi),nf2.format(k.cpi),k.risks.open,k.delay?'+'+k.delay+' j':'—',reasons(k).join(' · ')||'RAS']});
      secs.push({h:'Situation des projets actifs',table:{cols:['Code','Projet','Chef de projet','Santé','Réel / plan','SPI','CPI','Risques','Retard','Points d’attention'],rows}});
    }else{const k=kpi(proj);secs.push({h:'Indicateurs du projet',table:{cols:['Dimension','Statut','Détail'],rows:[['Délai',ragTxt(k.rag.schedule),`Réel ${Math.round(k.actual)} % · plan ${Math.round(k.planned)} % · SPI ${nf2.format(k.spi)}${k.delay?' · retard prévu '+k.delay+' j':''}`],['Budget',ragTxt(k.rag.budget),`EAC ${money(k.EAC)} pour ${money(k.B)} (${k.overrun>0?'+':''}${nf1.format(k.overrun*100)} %)`],['Qualité',ragTxt(k.rag.quality),k.qs==null?'Non mesurée':Math.round(k.qs)+' / 100'],['Risques',ragTxt(k.rag.risk),`${k.risks.open} ouverts dont ${k.risks.crit} critiques`]]}})}
    secs.push({h:'Faits marquants de la semaine',table:ups.length?{cols:['Projet','Date','Réalisations','Prochaines étapes','Points d’attention','Décisions'],rows:ups.map(({p,u})=>[p.code+' '+p.name,fdate(u.date),u.done||'',u.next||'',u.issues||'',u.decisions||''])}:null,p:ups.length?null:'Aucun point d’avancement saisi sur la période.'});
    const done=list.flatMap(p=>(p.tasks||[]).filter(t=>t.ms&&(+t.progress||0)>=100&&d2n(t.end)>=per.from&&d2n(t.end)<=per.to).map(t=>[p.code,t.name,fdate(t.end)]));
    if(done.length)secs.push({h:'Jalons atteints',table:{cols:['Projet','Jalon','Date'],rows:done}});
    const ms=allMilestones(list).filter(m=>d2n(m.end)>=per.to&&d2n(m.end)<=per.to+14&&(+m.progress||0)<100).sort((a,b)=>d2n(a.end)-d2n(b.end));

const parseDateAny=v=>{if(v==null||v==='')return '';if(v instanceof Date&&!isNaN(v))return n2d(Math.round(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate(),12)/DAY));
  if(typeof v==='number'&&v>20000&&v<80000)return n2d(Math.round(v-25569));
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){const y=+m[3]<100?2000+ +m[3]:+m[3];return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:''};
const cellVal=c=>{let v=c.value;if(v&&typeof v==='object'&&!(v instanceof Date)){if('result' in v)v=v.result;else if('text' in v)v=v.text;else if(v.richText)v=v.richText.map(x=>x.text).join('')}return v};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function sheetRows(ws){const out=[];if(!ws)return out;const head=[];ws.getRow(1).eachCell({includeEmpty:true},(c,i)=>head[i]=norm(cellVal(c)));
  ws.eachRow((row,n)=>{if(n===1)return;const o={};let any=false;head.forEach((h,i)=>{if(!h)return;const v=cellVal(row.getCell(i));if(v!==null&&v!==undefined&&v!==''){any=true}o[h]=v});if(any)out.push(o)});return out}
const g=(o,...ks)=>{for(const k of ks){const v=o[norm(k)];if(v!==undefined&&v!==null&&v!=='')return v}return ''};
const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:n};
const pickOf=(v,list,def)=>{const n=norm(v);return list.find(x=>norm(x)===n)||def};

    if(d2n(e)<d2n(s))e=s;let pg=g(r,'Avancement','Avancement %','%');pg=pg===''?0:num(pg);if(typeof g(r,'Avancement','Avancement %','%')==='number'&&pg>0&&pg<=1)pg*=100;
