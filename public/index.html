  Object.values(S.projects).forEach(p=>{if(touched.has(p.id)&&!(+p.budget)&&p.lines.length)p.budget=sum(p.lines,l=>l.planned)});
  sheetRows(wR).forEach((r,i)=>{const p=need('Risques',String(g(r,'Code projet','Code')).trim(),i);if(!p)return;reset(p,'risks');const title=String(g(r,'Risque','Intitulé','Intitule')).trim();if(!title){rep.skip.push('Risques, ligne '+(i+2)+' : intitulé manquant');return}
    p.risks.push({id:uid('r'),title,cat:pickOf(g(r,'Catégorie','Categorie'),RISK_CATS,'Technique'),prob:clamp(Math.round(num(g(r,'Probabilité','Probabilite'))||3),1,5),imp:clamp(Math.round(num(g(r,'Impact'))||3),1,5),owner:String(g(r,'Responsable')).trim(),resp:pickOf(g(r,'Réponse','Reponse','Stratégie'),RISK_RESP,'Réduire'),mitigation:String(g(r,'Plan de réponse','Plan','Mitigation')).trim(),due:parseDateAny(g(r,'Échéance','Echeance')),status:pickOf(g(r,'Statut'),RISK_STATUS,'Ouvert'),created:n2d(today())});rep.risks++});
  touched.forEach(id=>{if(S.projects[id])touch(S.projects[id])});render();
  openModal({title:'Import terminé',body:`<ul class="list"><li><span>Projets créés</span><b>${rep.newP}</b></li><li><span>Projets mis à jour</span><b>${rep.upP}</b></li><li><span>Tâches et jalons</span><b>${rep.tasks}</b></li><li><span>Lignes de budget</span><b>${rep.lines}</b></li><li><span>Risques</span><b>${rep.risks}</b></li></ul>${rep.skip.length?`<div><h3>${rep.skip.length} ligne(s) ignorée(s)</h3><div class="sm muted" style="max-height:160px;overflow:auto">${rep.skip.slice(0,40).map(x=>esc(x)).join('<br>')}</div></div>`:'<p class="muted" style="margin:0">Aucune ligne ignorée.</p>'}`,foot:'<button class="btn pri" data-act="modal-close">Fermer</button>'});
}
ACT['x-template']=async()=>{const wb=wbNew();
  const add=(name,cols,ex,w)=>{const ws=wb.addWorksheet(name,{views:[{state:'frozen',ySplit:1}]});tableSheet(ws,1,cols,ex,{widths:w,fmts:{}});return ws};
  const t0=today();
  add('Projets',['Code','Nom','Type','Chef de projet','Sponsor','Statut','Priorité','Début','Fin','Budget','Objectifs'],[['PRJ-101','Intégration API Orange Money','Intégration API','Nom Prénom','Direction des Opérations','En cours','Haute',dv(n2d(t0-30)),dv(n2d(t0+120)),85000000,'Ouvrir le paiement par Orange Money.']],[11,36,18,20,24,12,10,12,12,14,44]);
  add('Tâches',['Code projet','Phase','Tâche','Jalon','Responsable','Début','Fin','Avancement %','Dépend de'],[['PRJ-101','Cadrage','Cahier des charges','Non','Nom Prénom',dv(n2d(t0-30)),dv(n2d(t0-16)),100,''],['PRJ-101','Cadrage','Validation du périmètre','Oui','Nom Prénom',dv(n2d(t0-15)),dv(n2d(t0-15)),100,'1'],['PRJ-101','Réalisation','Développement du connecteur','Non','Nom Prénom',dv(n2d(t0-14)),dv(n2d(t0+40)),40,'2']],[12,16,38,8,18,12,12,12,14]);
  add('Budget',['Code projet','Catégorie','Libellé','Prévu','Engagé','Consommé','Reste à faire'],[['PRJ-101','Développement','Équipe de développement',40000000,30000000,18000000,''],['PRJ-101','Prestataires','Intégrateur',25000000,25000000,10000000,'']],[12,20,30,14,14,14,14]);
  add('Risques',['Code projet','Risque','Catégorie','Probabilité','Impact','Responsable','Réponse','Plan de réponse','Échéance','Statut'],[['PRJ-101','Retard de l’environnement du partenaire','Partenaire',4,4,'Nom Prénom','Réduire','Relance hebdomadaire et environnement de repli',dv(n2d(t0+15)),'Ouvert']],[12,44,16,11,8,18,12,44,12,12]);
  const ws=wb.addWorksheet('Lisez-moi');ws.getColumn(1).width=110;['Ce modèle sert à importer vos projets en une fois. Supprimez les lignes d’exemple avant de saisir vos données.','Le lien entre les feuilles se fait par la colonne « Code projet » (ou « Code » dans la feuille Projets).','Tâches : « Jalon » = Oui ou Non. « Dépend de » = numéro(s) de ligne de la tâche précédente dans le même projet (1 = première tâche du projet), séparés par une virgule.','Dates : jj/mm/aaaa. Montants : en nombres, sans symbole monétaire.','Réimporter un projet existant (même code) met à jour sa fiche et remplace ses tâches, lignes de budget et risques s’ils figurent dans le fichier.','Statuts : '+STATUSES.join(', ')+'. Priorités : '+PRIORITIES.join(', ')+'.','Risques : probabilité et impact de 1 à 5. Catégories : '+RISK_CATS.join(', ')+'.'].forEach((t,i)=>{const c=ws.getCell(i+1,1);c.value=t;c.alignment={wrapText:true}});
  await wbSave(wb,'Modele_import_portefeuille.xlsx')};
ACT['x-backup']=async()=>{const data=JSON.stringify({app:'pmo-portfolio',version:1,exported:new Date().toISOString(),settings:S.settings,projects:Object.values(S.projects).map(p=>{const c=thaw(p);delete c._mem;delete c._v;return c})},null,1);await saveFile(`Sauvegarde_portefeuille_${n2d(today())}.json`,new Blob([data],{type:'application/json'}))};
async function restoreBackup(file){let d;try{d=JSON.parse(await file.text())}catch(e){toast('Fichier de sauvegarde illisible.');return}
  if(!d||d.app!=='pmo-portfolio'||!Array.isArray(d.projects)){toast('Ce fichier n’est pas une sauvegarde de cette application.');return}
  confirmBox(`Restaurer <b>${d.projects.length}</b> projet(s) ? Les projets de même identifiant seront remplacés, les autres conservés.`,()=>{
    if(S.demo){S.projects={};S.demo=false}S.settings={...DEF_SETTINGS,...S.settings,...(d.settings||{}),startedClean:true};touchSettings();d.projects.forEach(p=>{const o=S.projects[p.id];if(o&&o._v!=null)p._v=o._v;else delete p._v;S.projects[p.id]=p;touch(p)});render();toast('Sauvegarde restaurée.')},'Restaurer')}
VIEWS.data=()=>{
  const n=plist().length;const demoN=plist().filter(p=>p.demo).length;
  return head('Données','Importer vos projets depuis Excel, sauvegarder, nettoyer')+
  `<div class="grid g2"><section class="card"><header><div><h2>Importer depuis Excel</h2><p>Reprenez votre classeur actuel en quelques minutes</p></div></header><div class="body" style="display:flex;flex-direction:column;gap:12px">
    <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Téléchargez le modèle (4 feuilles : Projets, Tâches, Budget, Risques).</li><li>Collez vos données dans les colonnes correspondantes.</li><li>Importez le fichier : les projets sont créés ou mis à jour d’après leur code.</li></ol>
    <div class="row"><button class="btn" data-act="x-template">Télécharger le modèle</button><label class="btn pri" for="imp" style="cursor:pointer">Importer un classeur .xlsx</label><input id="imp" type="file" accept=".xlsx" hidden data-file="xlsx"></div></div></section>
  <section class="card"><header><div><h2>Sauvegarde complète</h2><p>Un fichier JSON avec tous les projets et réglages</p></div></header><div class="body" style="display:flex;flex-direction:column;gap:12px"><p style="margin:0">Conservez une copie avant une grosse modification, ou pour passer d’un navigateur à un autre.</p><div class="row"><button class="btn" data-act="x-backup">Télécharger la sauvegarde</button><label class="btn" for="rst" style="cursor:pointer">Restaurer une sauvegarde</label><input id="rst" type="file" accept=".json,application/json" hidden data-file="json"></div></div></section></div>
  <section class="card"><header><div><h2>Exports Excel disponibles</h2></div></header><div class="body"><ul class="list"><li><span><b>Gantt d’un projet</b><div class="sm muted">Fiche projet, onglet Planning, bouton « Gantt en Excel »</div></span></li><li><span><b>Roadmap du portefeuille</b><div class="sm muted">Page Roadmap</div></span><button class="btn sm" data-act="x-road">Exporter</button></li><li><span><b>Portefeuille, budget, risques</b><div class="sm muted">Un classeur par thème, avec formules et filtres</div></span><span class="row"><button class="btn sm" data-act="x-port">Portefeuille</button><button class="btn sm" data-act="x-budget">Budget</button><button class="btn sm" data-act="x-risks">Risques</button></span></li><li><span><b>Rapports hebdomadaire, mensuel, global</b><div class="sm muted">Page Rapports</div></span><button class="btn sm" data-act="nav" data-v="rep">Ouvrir</button></li></ul></div></section>
  ${S.mode==='api'&&S.user&&S.user.role==='admin'?'<section class="card"><header><div><h2>Historique des modifications</h2><p>Qui a modifié quoi et quand, conservé dans la base</p></div><button class="btn" data-act="audit-open">Consulter</button></header></section>':''}
  <section class="card"><header><h2>Nettoyage</h2></header><div class="body"><ul class="list"><li><span>${n} projet(s) dans le portefeuille${demoN?`, dont ${demoN} de démonstration`:''}</span><span class="row">${demoN&&!S.demo?'<button class="btn sm danger" data-act="demo-remove">Supprimer les projets de démo</button>':''}${n?'<button class="btn sm danger" data-act="all-remove">Tout supprimer</button>':''}</span></li></ul></div></section>`;
};
ACT['demo-remove']=()=>confirmBox('Supprimer tous les projets de démonstration ?',removeDemoProjects);
ACT['all-remove']=()=>confirmBox('Supprimer <b>tous</b> les projets du portefeuille ? Pensez à télécharger une sauvegarde avant.',()=>{if(S.demo){startClean();return}Object.keys(S.projects).forEach(dropProject);S.settings.startedClean=true;touchSettings();render();toast('Portefeuille vidé.')});

VIEWS.set=()=>{const s=S.settings;
  const list=(k,l,hint)=>`<label class="f" for="s_${k}">${l}<textarea id="s_${k}" data-set="${k}" rows="6">${esc(s[k].join('\n'))}</textarea><span class="sm muted">${hint}</span></label>`;
  return head('Paramètres','Organisation, seuils d’alerte et listes de référence')+
  `<div class="grid g2"><section class="card"><header><h2>Organisation</h2></header><div class="body form"><label class="f wide" for="s_org">Nom affiché dans l’application et les rapports<input id="s_org" data-set="org" value="${esc(s.org)}" placeholder="Peers Exchange Cameroon"></label>
    <label class="f wide" for="s_cur">Devise<select id="s_cur" data-set="cur">${optsHTML([['XAF','FCFA (XAF)'],['EUR','Euro (EUR)'],['USD','Dollar US (USD)']],s.cur)}</select></label></div></section>
  <section class="card"><header><div><h2>Seuils d’alerte</h2><p>Ils pilotent les feux vert, orange et rouge</p></div></header><div class="body form">
    <label class="f" for="s_spiWarn">Délai : orange sous un SPI de<input id="s_spiWarn" type="number" step="0.01" min="0" max="1.5" data-set="spiWarn" data-n="1" value="${s.spiWarn}"></label>
    <label class="f" for="s_spiBad">Délai : rouge sous un SPI de<input id="s_spiBad" type="number" step="0.01" min="0" max="1.5" data-set="spiBad" data-n="1" value="${s.spiBad}"></label>
    <label class="f" for="s_ovWarn">Budget : orange au-delà de (écart EAC)<input id="s_ovWarn" type="number" step="0.01" min="0" max="2" data-set="ovWarn" data-n="1" value="${s.ovWarn}"></label>
    <label class="f" for="s_ovBad">Budget : rouge au-delà de (écart EAC)<input id="s_ovBad" type="number" step="0.01" min="0" max="2" data-set="ovBad" data-n="1" value="${s.ovBad}"></label>
    <label class="f" for="s_qWarn">Qualité : vert à partir d’un score de<input id="s_qWarn" type="number" step="1" min="0" max="100" data-set="qWarn" data-n="1" value="${s.qWarn}"></label>
    <label class="f" for="s_qBad">Qualité : rouge sous un score de<input id="s_qBad" type="number" step="1" min="0" max="100" data-set="qBad" data-n="1" value="${s.qBad}"></label>
    <p class="sm muted wide" style="margin:0">Le SPI compare l’avancement réel au planifié (1,00 = dans les temps). L’écart EAC est la prévision à terminaison moins le budget, divisée par le budget (0,05 = 5 %).</p></div></section></div>
  <div class="grid g2"><section class="card"><header><h2>Types de projet</h2></header><div class="body">${list('types','Un type par ligne','Utilisés pour regrouper la roadmap et le budget.')}</div></section>
  <section class="card"><header><h2>Catégories de dépense</h2></header><div class="body">${list('cats','Une catégorie par ligne','Proposées dans les lignes budgétaires.')}</div></section></div>
  <section class="card"><header><h2>Comment sont calculés les indicateurs</h2></header><div class="body sm" style="display:grid;gap:8px">
   <div><b>Avancement planifié</b> : part de la durée écoulée de chaque tâche, pondérée par sa durée. <b>Réel</b> : avancement saisi par tâche, pondéré de la même façon.</div>
   <div><b>SPI</b> = réel ÷ planifié. <b>Retard prévisionnel</b> : date de fin projetée au rythme actuel, moins la fin prévue.</div>
   <div><b>EAC</b> = consommé + reste à faire. <b>CPI</b> = valeur acquise (budget × avancement réel) ÷ consommé.</div>
   <div><b>Santé globale</b> = pire des trois dimensions (délai, budget, qualité), sauf si vous la forcez sur la fiche projet.</div></div></section>`;
};

/* ===== Événements et démarrage ===== */
ACT.open=d=>{V.view='proj';V.pid=d.id;V.tab=d.tab||'summary';render();window.scrollTo(0,0)};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;
  const f=ACT[el.dataset.act];if(!f)return;if(el.tagName==='A')e.preventDefault();
  if(e.target.closest('input,select,textarea,label'))return;
  try{f(el.dataset,e)}catch(err){console.error(err);toast('Action impossible : '+err.message)}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f!==undefined){V[t.dataset.f]=t.value;render();return}
  if(t.dataset.chg==='task-prog'){setTaskProg(t.dataset.id,t.value);return}
  if(t.dataset.calyear){V.cal.y=+t.value;render();return}
  if(t.dataset.cald){const days=new Set(calCfg().days);if(t.checked)days.add(+t.dataset.cald);else days.delete(+t.dataset.cald);if(!days.size){toast('Au moins un jour de travail est nécessaire.');render();return}calSet({days:[...days].sort()});render();return}
  if(t.dataset.cal){const k=t.dataset.cal;if(k==='carry'){calSet({carry:t.checked});render();return}
    const c=calCfg(),n={...c,[k]:t.value};const [a,b,x,y]=[hm(n.start),hm(n.end),hm(n.bs),hm(n.be)];
    if([a,b,x,y].some(isNaN)||!(a<x&&x<=y&&y<b)){toast('Horaires incohérents : début < début de pause ≤ fin de pause < fin de journée.');render();return}
    calSet({[k]:t.value});render();toast('Horaires enregistrés.');return}
  if(t.dataset.rep){V.rep[t.dataset.rep]=t.value;if(t.dataset.rep==='scope'&&t.value==='project'&&!V.rep.pid)V.rep.pid=(listProjects()[0]||{}).id||'';render();return}
  if(t.dataset.set){const k=t.dataset.set;let v=t.value;if(['types','cats'].includes(k)){v=v.split('\n').map(x=>x.trim()).filter(Boolean);if(!v.length)v=DEF_SETTINGS[k]}else if(t.dataset.n)v=+v;S.settings[k]=v;touchSettings();render();toast('Paramètre enregistré.');return}
  if(t.dataset.file){const f=t.files&&t.files[0];t.value='';if(!f)return;if(t.dataset.file==='xlsx')importExcel(f);else restoreBackup(f)}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f==='q'){V.q=t.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.tagName==='TR'&&e.target.dataset.act){e.preventDefault();ACT[e.target.dataset.act](e.target.dataset)}});
window.addEventListener('error',e=>console.error(e.error||e.message));
(function boot(){
  const go=()=>{render();initStore().catch(err=>{console.error(err);S.mode='local';loadLocal();settleDemo();S.loaded=true;render()})};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();

</script>
</body>
